<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0F304A" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Lumax Punch List" />
<meta name="color-scheme" content="light" />
<title>Lumax Punch List</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<style>
/* ── tokens ───────────────────────────────────────────────────────────────
   Screen colours are the report colours. A pin that is red on the plan is
   red in the Word file and red in the list — one language everywhere.      */
:root{
  --navy:#0F304A; --steel:#156082; --steel-dk:#0E4560;
  --hr:#B42318; --lr:#B54708; --ok:#027A48; --pend:#156082;
  --paper:#EEF2F6; --surface:#FFFFFF; --band:#E8EDF2; --line:#C9D4DE;
  --ink:#12212E; --ink-2:#3D5567; --ink-3:#6B7F8F;
  --rail:6px; --tap:46px; --r:10px;
  --shadow:0 1px 2px rgba(15,48,74,.10), 0 6px 18px -8px rgba(15,48,74,.28);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
/* Sun mode: for a phone screen in direct veld sunlight. */
body.sun{ --paper:#FFFFFF; --band:#DCE6EE; --line:#7C93A6; --ink:#000000;
  --ink-2:#12212E; --ink-3:#31485B; --shadow:0 0 0 1px #7C93A6; }
body.sun .btn{ font-weight:800; }
body.sun .chip,body.sun .tag{ border-width:2px; }

*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:var(--sans); color:var(--ink); background:var(--paper);
  font-size:15px; line-height:1.45; -webkit-text-size-adjust:100%;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
/* iOS Safari only sends taps on a span/div/img to the click handler when the
   element has a pointer cursor, so give every data-a target one. */
[data-a]{cursor:pointer}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
a{color:var(--steel)}
.hide{display:none !important}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ── shell ─────────────────────────────────────────────────────────────── */
.app{min-height:100%;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:40;background:var(--navy);color:#fff;
  padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;
  display:flex;align-items:center;gap:10px;
}
.topbar .brandmark{height:26px;width:auto;display:block;filter:brightness(0) invert(1)}
.topbar .where{flex:1;min-width:0}
.topbar .where b{display:block;font-size:14px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .where span{display:block;font-size:11px;color:#A9C2D4;font-family:var(--mono)}
.iconbtn{
  background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.22);color:#fff;
  height:38px;min-width:38px;padding:0 10px;border-radius:8px;font-size:13px;font-weight:600;
}
.iconbtn:active{background:rgba(255,255,255,.22)}
.iconbtn.on{background:#fff;color:var(--navy)}

main{flex:1;padding:12px 12px 96px;max-width:1500px;width:100%;margin:0 auto}
.stack{display:flex;flex-direction:column;gap:12px}

/* ── surfaces ──────────────────────────────────────────────────────────── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card>.card-h{
  padding:10px 12px;border-bottom:1px solid var(--line);display:flex;
  align-items:center;gap:8px;justify-content:space-between;
}
.card-h h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--navy)}
.card-b{padding:12px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);font-weight:700}
.muted{color:var(--ink-3);font-size:13px;overflow-wrap:anywhere}
.empty{padding:26px 16px;text-align:center;color:var(--ink-3);font-size:14px}
.empty b{display:block;color:var(--ink-2);font-size:15px;margin-bottom:4px}

/* ── buttons ───────────────────────────────────────────────────────────── */
.btn{
  min-height:var(--tap);padding:0 14px;border-radius:9px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font-weight:650;font-size:14px;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
}
.btn:active{transform:translateY(1px)}
.btn-p{background:var(--steel);border-color:var(--steel-dk);color:#fff}
.btn-n{background:var(--navy);border-color:var(--navy);color:#fff}
.btn-d{background:#fff;border-color:var(--hr);color:var(--hr)}
.btn-ok{background:var(--ok);border-color:#026A3F;color:#fff}
.btn-sm{min-height:36px;padding:0 10px;font-size:13px;border-radius:8px}
.btn-xs{min-height:30px;padding:0 8px;font-size:12px;border-radius:7px;font-weight:600}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-row>.btn{flex:1 1 auto}
.btn-row>.btn-share{flex:0 0 auto}
.fab{
  position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);z-index:35;
  height:58px;padding:0 20px;border-radius:29px;background:var(--steel);color:#fff;
  border:1px solid var(--steel-dk);box-shadow:0 8px 22px -6px rgba(15,48,74,.55);
  font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:9px;
}

/* ── forms ─────────────────────────────────────────────────────────────── */
.field{display:block;margin-bottom:12px}
.field>span.lbl{
  display:block;font-size:11px;font-weight:700;text-transform:uppercase;
  letter-spacing:.07em;color:var(--ink-2);margin-bottom:5px;
}
.inp,select.inp,textarea.inp{
  width:100%;min-height:var(--tap);padding:9px 11px;border:1px solid var(--line);
  border-radius:9px;background:var(--surface);
}
textarea.inp{min-height:82px;resize:vertical;line-height:1.4}
.inp:focus,.btn:focus-visible,.iconbtn:focus-visible{outline:3px solid #7FB3D0;outline-offset:1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 10px}
.seg{display:flex;gap:0;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;min-height:var(--tap);border:0;background:transparent;font-weight:650;font-size:13px;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--navy);color:#fff}
.seg.risk button.on[data-v="HR"]{background:var(--hr)}
.seg.risk button.on[data-v="LR"]{background:var(--lr)}

/* ── tags & chips ──────────────────────────────────────────────────────── */
.tag{
  display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:5px;
  font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;
  border:1.5px solid currentColor;line-height:1.4;white-space:nowrap;
}
.t-HR{color:var(--hr)} .t-LR{color:var(--lr)}
.t-open{color:var(--hr)} .t-in_progress,.t-fixed{color:var(--lr)}
.t-pending_verification{color:var(--pend)} .t-verified,.t-closed{color:var(--ok)}
.t-verification_failed{color:var(--hr)}
.chip{
  display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 11px;
  border-radius:17px;border:1px solid var(--line);background:var(--surface);
  font-size:13px;font-weight:600;color:var(--ink-2);
}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chiprow{display:flex;gap:7px;flex-wrap:wrap}
.scroller{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.scroller::-webkit-scrollbar{height:0}

/* ── the risk rail: signature element ──────────────────────────────────── */
.rail{
  position:relative;background:var(--surface);border:1px solid var(--line);
  border-left-width:var(--rail);border-radius:var(--r);padding:10px 12px 10px 12px;
  display:block;width:100%;text-align:left;box-shadow:var(--shadow);
}
.rail.r-HR{border-left-color:var(--hr)} .rail.r-LR{border-left-color:var(--lr)}
.rail.done{border-left-color:var(--ok)}
.rail+.rail{margin-top:8px}
.rail:active{background:#F7FAFC}
.rail .rh{display:flex;align-items:center;gap:8px;margin-bottom:3px}
.rail .num{
  font-family:var(--mono);font-size:12px;font-weight:700;color:#fff;background:var(--navy);
  min-width:26px;height:22px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;
  padding:0 5px;
}
.rail.r-HR .num{background:var(--hr)} .rail.r-LR .num{background:var(--lr)}
.rail.done .num{background:var(--ok)}
.rail .desc{display:block;font-size:14px;line-height:1.35;color:var(--ink);word-break:break-word}
.rail .meta{display:block;font-size:11.5px;color:var(--ink-3);margin-top:4px;font-family:var(--mono)}
.rail .meta .late{color:var(--hr);font-weight:700}
.rail .thumb{
  float:right;width:58px;height:58px;object-fit:cover;border-radius:7px;margin:0 0 6px 10px;
  border:1px solid var(--line);background:var(--band);
}

/* ── lists ─────────────────────────────────────────────────────────────── */
.row{
  width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:11px 12px;display:flex;align-items:center;gap:10px;
  min-height:var(--tap);box-shadow:var(--shadow);
}
.row+.row{margin-top:8px}
.row .grow{flex:1;min-width:0}
.row b{display:block;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub{display:block;font-size:12px;color:var(--ink-3);font-family:var(--mono);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.count{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--ink-2);
  background:var(--band);border-radius:6px;padding:3px 7px;white-space:nowrap}
.count.hr{background:#FBE9E7;color:var(--hr)}
.count.ok{background:#E3F5EC;color:var(--ok)}

/* ── tabs (mobile bottom bar / desktop inline) ─────────────────────────── */
.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:38;display:flex;background:var(--surface);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);
}
.tabs button{
  flex:1;border:0;background:transparent;padding:9px 2px 8px;font-size:11px;font-weight:700;
  color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase;
  border-top:3px solid transparent;margin-top:-1px;
}
.tabs button.on{color:var(--navy);border-top-color:var(--steel)}
.tabs .n{display:block;font-family:var(--mono);font-size:15px;font-weight:700;line-height:1.1}

/* ── photos ────────────────────────────────────────────────────────────── */
.photogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.photocell{position:relative;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--band)}
.photocell img{width:100%;height:104px;object-fit:cover;display:block}
.photocell .k{
  position:absolute;left:4px;top:4px;font-size:9.5px;font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;background:rgba(15,48,74,.86);color:#fff;padding:2px 5px;border-radius:4px;
  border:0;margin:0;-webkit-appearance:none;appearance:none;
}
/* A plain button around a photo so it can be tapped and reached by keyboard
   without changing how the photo looks. */
.ph{display:block;width:100%;padding:0;margin:0;border:0;background:none;border-radius:9px;
  -webkit-appearance:none;appearance:none;text-align:left}
.ph:focus-visible{outline:3px solid #7FB3D0;outline-offset:-3px}
.photocell .k:focus-visible{outline:3px solid #7FB3D0;outline-offset:1px}
/* Stands in for a photo listed on the snag but not stored on this device. */
.ph-gone{height:104px;display:flex;align-items:center;justify-content:center;text-align:center;
  padding:34px 8px 8px;font-size:12px;font-weight:700;line-height:1.25;color:var(--ink-3)}
.photocell .x{
  position:absolute;right:3px;top:3px;width:34px;height:34px;border-radius:17px;border:0;
  background:rgba(180,35,24,.92);color:#fff;font-size:15px;line-height:1;font-weight:700;
}
.dropzone{
  border:2px dashed var(--line);border-radius:var(--r);padding:16px;text-align:center;
  color:var(--ink-3);font-size:13px;background:var(--surface);
}

/* ── plan / pins ───────────────────────────────────────────────────────── */
.planwrap{position:relative;background:var(--band);border:1px solid var(--line);
  border-radius:var(--r);overflow:hidden;touch-action:manipulation}
.planwrap img{width:100%;display:block}
.planwrap.placing{outline:3px solid var(--steel);outline-offset:-3px;cursor:crosshair}
/* Touch screens show no cursor, and iOS needs a pointer one to send the tap. */
@media (hover:none){.planwrap.placing{cursor:pointer}}
.pin{
  position:absolute;transform:translate(-50%,-50%);width:28px;height:28px;border-radius:14px;
  border:2.5px solid #fff;color:#fff;font-family:var(--mono);font-size:12px;font-weight:700;
  display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px rgba(0,0,0,.4);
}
.pin.r-HR{background:var(--hr)} .pin.r-LR{background:var(--lr)} .pin.done{background:var(--ok)}
.pin.sel{outline:3px solid #FFD166;outline-offset:2px}

/* ── sheet / modal ─────────────────────────────────────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(10,26,40,.55);z-index:60;display:flex;
  align-items:flex-end;justify-content:center}
.sheet{
  background:var(--surface);width:100%;max-width:760px;max-height:94vh;max-height:94dvh;overflow-y:auto;
  border-radius:16px 16px 0 0;box-shadow:0 -8px 30px rgba(10,26,40,.35);
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
}
.sheet-h{
  position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);
  padding:12px 14px;display:flex;align-items:center;gap:10px;z-index:2;
}
.sheet-h h2{font-size:15px;flex:1}
.sheet-b{padding:14px}
.sheet-f{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 14px}

/* ── toast / banner ────────────────────────────────────────────────────── */
.toast{
  position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);
  transform:translate(-50%,14px);background:var(--navy);color:#fff;padding:11px 16px;
  border-radius:10px;font-size:14px;font-weight:600;z-index:90;opacity:0;pointer-events:none;
  transition:opacity .14s,transform .14s;max-width:88vw;text-align:center;box-shadow:var(--shadow);
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--hr)}
.banner{
  border-radius:var(--r);padding:11px 12px;font-size:13.5px;border:1px solid;
  display:flex;gap:9px;align-items:flex-start;
}
.banner.warn{background:#FEF6EC;border-color:#E5B87A;color:#6B4210}
.banner.bad{background:#FDEDEA;border-color:#E7A99F;color:#7A1E14}
.banner.good{background:#E6F5EE;border-color:#96CDB4;color:#065E3B}
.banner.info{background:#EAF2F8;border-color:#9EC2D8;color:#12435F}
.banner b{display:block}
.stale{position:fixed;inset:0;z-index:100;background:rgba(10,26,40,.62);display:flex;
  align-items:center;justify-content:center;padding:16px}
.stale .banner{max-width:420px;box-shadow:var(--shadow)}

/* ── preflight ─────────────────────────────────────────────────────────── */
.check{display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--band);font-size:13.5px}
.check:last-child{border-bottom:0}
.check .m{font-weight:800;font-family:var(--mono);flex:0 0 20px}
.check.pass .m{color:var(--ok)} .check.fail .m{color:var(--hr)} .check.warn .m{color:var(--lr)}
.check.wait .m{color:var(--ink-3)}

/* ── progress ──────────────────────────────────────────────────────────── */
.bar{height:8px;border-radius:4px;background:var(--band);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar i.open{background:var(--hr)} .bar i.prog{background:var(--lr)} .bar i.done{background:var(--ok)}

/* ── desktop ───────────────────────────────────────────────────────────── */
@media (min-width:1000px){
  :root{--tap:42px}
  body{font-size:14.5px}
  main{padding:16px 20px 40px}
  .tabs{
    position:static;border-top:0;border:1px solid var(--line);border-radius:var(--r);
    background:var(--surface);box-shadow:var(--shadow);overflow:hidden;
    width:calc(100% - 40px);max-width:1460px;margin:16px auto 0;
  }
  .tabs button{padding:11px 8px;font-size:12px;border-top:0;border-bottom:3px solid transparent}
  .tabs button.on{border-bottom-color:var(--steel);background:#F4F8FB}
  .tabs .n{display:inline;font-size:12px;margin-left:6px}
  .fab{bottom:26px;right:26px}
  .split{display:grid;grid-template-columns:minmax(340px,420px) 1fr;gap:16px;align-items:start}
  .split-3{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
  .scrim{align-items:center;padding:20px}
  .sheet{border-radius:14px;max-height:88vh;max-height:88dvh}
  .sticky{position:sticky;top:76px}
  .desk-hide{display:none !important}
}
@media (max-width:999px){
  .mob-hide{display:none !important}
  /* iOS Safari zooms the page into any field under 16px and leaves it zoomed. */
  .inp,select.inp,textarea.inp{font-size:16px}
}
@media (prefers-reduced-motion:reduce){ *{transition:none !important;animation:none !important} }
@media print{ .topbar,.tabs,.fab,.toast{display:none !important} }
.cal-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.cal-nav b{font-size:15px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);text-align:center;padding:4px 0}
.cal button{min-height:40px;border:0;background:transparent;border-radius:8px;font-weight:650}
.cal button.out{color:var(--ink-3)}
.cal button.on{background:var(--navy);color:#fff}
.cal button.today:not(.on){outline:2px solid var(--steel);outline-offset:-2px}
.datebtn{width:100%;min-height:var(--tap);padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface);text-align:left;font-weight:650}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <img class="brandmark" id="brandmark" alt="Lumax Energy" />
    <div class="where">
      <b id="whereTitle">Lumax Punch List</b>
      <span id="whereSub">Loading…</span>
    </div>
    <button class="iconbtn" id="btnSun" title="High-contrast mode for sunlight">Sun</button>
    <button class="iconbtn" id="btnHome">Home</button>
  </header>
  <div id="tabs"></div>
  <main id="view"><div class="empty">Loading…</div></main>
</div>
<div id="fab"></div>
<div id="modal"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
// The one place the app version is set. Shown in Settings, written into

    }, function (err) {

  /* A full backup is a store-only .zip: backup.json (the data, with photo

     full backup put every photo in one JSON string as base64, which ran

     parts, so the photo bytes are never copied into one big buffer. */
  const ZIP_DAMAGED = "This backup .zip is damaged or incomplete.";

  /** CRC and length of one entry. The bytes are dropped on return, so only
   *  one photo is ever read into memory at a time. */
  async function crcOf(data) {
    const bytes = await toBytes(data);
    return bytes ? { crc: DocxKit.crc32(bytes), size: bytes.length } : { crc: 0, size: 0 };

  /** [{ name, data: Blob | bytes }] → a store-only zip Blob. */
  async function zipBlob(entries) {
    if (entries.length > 0xffff) throw new Error("Too many photos for one backup file.");
    const now = DocxKit.dosTime(new Date());
    const enc = new TextEncoder();
    const parts = [];
    const central = [];
    let offset = 0;
    for (const e of entries) {
      const name = enc.encode(e.name);
      const sum = await crcOf(e.data);
      // Plain zip offsets stop at 4 GB; fail clearly rather than write a
      // file nothing can open.
      if (offset + 30 + name.length + sum.size > 0xffffffff) {
        throw new Error("This backup would be over 4 GB. Remove unused photos, or back up data only.");
      }
      const local = new DataView(new ArrayBuffer(30));
      local.setUint32(0, 0x04034b50, true);
      local.setUint16(4, 20, true);          // version needed
      local.setUint16(6, 0x0800, true);      // flags: names are UTF-8
      local.setUint16(8, 0, true);           // method: store
      local.setUint16(10, now.time, true);
      local.setUint16(12, now.date, true);
      local.setUint32(14, sum.crc, true);
      local.setUint32(18, sum.size, true);
      local.setUint32(22, sum.size, true);
      local.setUint16(26, name.length, true);
      // The photo Blob itself goes in as a part: the browser points at it
      // instead of copying it into memory.
      parts.push(local.buffer, name, e.data);

      const cd = new DataView(new ArrayBuffer(46));
      cd.setUint32(0, 0x02014b50, true);
      cd.setUint16(4, 20, true);
      cd.setUint16(6, 20, true);
      cd.setUint16(8, 0x0800, true);
      cd.setUint16(12, now.time, true);
      cd.setUint16(14, now.date, true);
      cd.setUint32(16, sum.crc, true);
      cd.setUint32(20, sum.size, true);
      cd.setUint32(24, sum.size, true);
      cd.setUint16(28, name.length, true);
      cd.setUint32(42, offset, true);
      central.push(cd.buffer, name);

      offset += 30 + name.length + sum.size;
    }
    let centralSize = 0;
    central.forEach(function (c) { centralSize += c.byteLength; });
    if (offset + centralSize > 0xffffffff) {
      throw new Error("This backup would be over 4 GB. Remove unused photos, or back up data only.");
    }
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true);
    end.setUint16(8, entries.length, true);
    end.setUint16(10, entries.length, true);
    end.setUint32(12, centralSize, true);
    end.setUint32(16, offset, true);
    return new Blob(parts.concat(central, [end.buffer]), { type: "application/zip" });
  }

  /** Bytes [a, b) of a file as a DataView. */
  async function readRange(file, a, b) {
    const u = await toBytes(file.slice(a, b));

    let end = -1;

    }
    if (end < 0) throw new Error(ZIP_DAMAGED);
