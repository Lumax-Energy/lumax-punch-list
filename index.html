  /* ------------------------------------------------------------ photos --- */
  let fileInput = null;
  function pickFile(accept, useCamera, single) {
    return new Promise(function (res) {
      if (fileInput) fileInput.remove();
      fileInput = document.createElement("input");
      fileInput.type = "file";
      fileInput.accept = accept || "image/*";
      fileInput.multiple = !useCamera && !single;
      if (useCamera) fileInput.setAttribute("capture", "environment");
      fileInput.style.display = "none";
      let settled = false;
      const finish = function (files) {
        if (settled) return;
        settled = true;
        res(files);
        if (fileInput) { fileInput.remove(); fileInput = null; }
      };
      fileInput.addEventListener("change", function () {
        finish(Array.prototype.slice.call(fileInput.files || []));
      });
      fileInput.addEventListener("cancel", function () {
        finish([]);
      });
      document.body.appendChild(fileInput);
      fileInput.click();
    });
  }

  // The kind a new snag photo gets: Close-out once the snag is fixed or later.
  function newPhotoKind(s) {
    return s && CLOSEOUT_STATUSES.indexOf(s.status) >= 0 ? "closeout" : "before";
  }

  async function addPhotos(target, kindHint, useCamera) {
    const files = await pickFile("image/*", !!useCamera);
    if (!files.length) return;
    UI.toast("Processing " + files.length + " photo" + (files.length > 1 ? "s" : "") + "…");
    const i = insp();
    // Decide the snag now: the user may close this sheet or open another one
    // while the photos are still being processed.
    const snag = target === "snag" && App.modal && App.modal.type === "snag" ? snagById(App.modal.id) : null;
    // Snag photos take their kind from the snag's status, decided once so a
    // batch never ends up split across two kinds.
    const kind = snag ? newPhotoKind(snag) : kindHint || "before";
    let added = 0, failed = 0;
    for (const f of files) {
      try {
        const rec = await Store.addPhoto(f, { kind: kind });
        if (target === "site") {
          if (i.site_photo_id) await Store.delPhoto(i.site_photo_id);
          i.site_photo_id = rec.id;
        } else if (target === "plan") {
          if (i.site_plan_id) await Store.delPhoto(i.site_plan_id);
          i.site_plan_id = rec.id;
        } else if (snag) {
          snag.photos.push(rec.id);
          snag.updated_at = new Date().toISOString();
          added++;
        }
      } catch (err) {
        failed++;
        UI.toast(err.message || "That photo could not be added", true, 5000);
      }
    }
    await Store.save();
    UI.clearUsage();
    if (snag && App.modal && App.modal.type === "snag" && App.modal.id === snag.id) snagSheet(snag.id);
    UI.render();
    // Say which kind the photos were saved as. Leave an error toast showing.
    if (added && !failed) {
      UI.toast(added + " " + (kind === "closeout" ? "close-out" : "before") + " photo" + (added > 1 ? "s" : "") + " added");
    }
  }

  function parseCoords(text) {
    const m = String(text || "").trim().match(/(-?\d+(?:\.\d+)?)\s*[,;\s]\s*(-?\d+(?:\.\d+)?)/);
    if (!m) return null;
    const lat = parseFloat(m[1]), lng = parseFloat(m[2]);
    if (!isFinite(lat) || !isFinite(lng) || lat < -90 || lat > 90 || lng < -180 || lng > 180) return null;
    return { lat: lat, lng: lng };
  }
  function saveCoords(s, lat, lng, acc) {
    s.lat = lat; s.lng = lng; s.gps_accuracy = acc == null ? null : acc;
    s.updated_at = new Date().toISOString();
    Store.save();
    App.snagId = s.id;
    // snagSheet sets App.modal itself, after saving any pending typing to the
    // sheet it was typed in (setting it here first would send it to the snag).
    snagSheet(s.id);
  }
  // iPhones and iPads (iPadOS asks for the desktop site, so it says Mac but
  // has touch) keep the location switch for web pages under Safari, not Chrome.
  function isIOS() {
    return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  }
  /** keep: redraw the GPS sheet that is already open for this snag without
   *  losing the coordinates typed into it. */
  function gpsSheet(s, status, trying, keep) {
    // Save what was just typed while App.modal still names the sheet it was typed in.
    flushPendingField();
    const old = keep && App.modal && App.modal.type === "gps" && App.modal.snagId === s.id ? App.modal.draft : null;
    App.snagId = s.id;
    App.modal = { type: "gps", id: s.id, snagId: s.id, draft: old || { lat: s.lat != null ? String(s.lat) : "", lng: s.lng != null ? String(s.lng) : "", pair: "" } };
    const banner = status
      ? '<div class="banner ' + (trying ? "info" : "warn") + '" style="margin-bottom:12px"><span>' +
        (trying ? "◎" : "!") + "</span><span>" + esc(status) + "</span></div>"
      : "";
    const ios = isIOS();
    UI.openModal(
      UI.sheetHead("GPS") +
      '<div class="sheet-b">' + banner +
      '<div class="btn-row" style="margin-bottom:12px">' +
      '<button class="btn btn-p" data-a="gps-retry"' + (trying ? " disabled" : "") + ">Use phone GPS</button>" +
      "</div>" +
      UI.field("Latitude", UI.input("gps.lat", App.modal.draft.lat, { placeholder: "-25.7479", inputmode: "decimal" })) +
      UI.field("Longitude", UI.input("gps.lng", App.modal.draft.lng, { placeholder: "28.2293", inputmode: "decimal" })) +
      UI.field("Or paste both", UI.input("gps.pair", App.modal.draft.pair, { placeholder: "-25.7479, 28.2293" })) +
      '<div class="btn-row">' +
      '<button class="btn btn-p" data-a="gps-save">Save coordinates</button>' +
      '<button class="btn" data-a="back-to-snag">Back to snag</button></div>' +
      '<p class="muted" style="margin-top:12px">' + (ios
        ? "If the phone will not give a position, turn on Settings → Privacy & Security → Location Services → Safari Websites (While Using), and in Safari tap aA → Website Settings → Location → Allow. "
        : location.protocol === "file:"
        ? "Allowing Location for Chrome is not enough if you opened this file from Downloads. Chrome still blocks live GPS on file://. "
        : "If the phone will not give a position, allow Location for this site (lock icon near the address). ") +
      "Paste from Google Maps (share → copy coordinates) or place a pin on the plan.</p>" +
      "</div>",
      "gps:" + s.id
    );
  }
  function requestGps(s) {
    if (!s) return;
    // A fix can take up to 20 s. Each request gets its own token, so only the
    // newest one may act, and only on its own snag's GPS or snag sheet.
    const req = {};
    App.gpsReq = req;
    gpsSheet(s, "Asking the phone for a position… Allow location if it asks.", true, true);
    // Typing from here on means the coordinates were entered by hand.
    App.modal.draft.typed = false;
    if (!navigator.geolocation) {
      gpsSheet(s, "This browser has no location support. Paste coordinates from Maps.", false, true);
      return;
    }
    // Which sheet is open for this snag now: "gps", "snag" or null (moved on).
    function openFor(id) {
      const m = App.modal;
      if (m && m.type === "gps" && m.snagId === id) return "gps";
      if (m && m.type === "snag" && m.id === id) return "snag";
      return null;
    }
    navigator.geolocation.getCurrentPosition(function (pos) {
      if (App.gpsReq !== req) return;
      App.gpsReq = null;
      flushPendingField();
      // A restore can swap state while we wait, so look the snag up again.
      const cur = snagById(s.id);
      const where = cur ? openFor(cur.id) : null;
      if (where === "snag" || (where === "gps" && !App.modal.draft.typed)) {
        saveCoords(cur, pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy);
        UI.toast("Position captured ±" + Math.round(pos.coords.accuracy) + " m");
      } else if (where === "gps") {
        // Never overwrite coordinates typed while waiting.
        gpsSheet(cur, "The phone's position arrived after you typed coordinates, so yours were kept. Tap Save coordinates, or Use phone GPS to replace them.", false, true);
      } else if (cur) {
        // The user is on another screen: do not take it over or save behind their back.
        UI.toast("GPS for snag " + cur.snag_number + " arrived after you left it and was not saved. Tap Capture GPS to try again.", false, 5000);
      }
    }, function (err) {
      if (App.gpsReq !== req) return;
      App.gpsReq = null;
      const ios = isIOS();
      var msg = "Could not get a position.";
      if (err && err.code === 1) {
        if (ios) {
          msg = "Location is blocked for Safari. Settings → Privacy & Security → Location Services → Safari Websites → While Using, then in Safari tap aA → Website Settings → Location → Allow. Or paste from Maps, or pin on the plan.";
        } else if (!window.isSecureContext || location.protocol === "file:") {
          msg = "Chrome blocked GPS on this downloaded file. Location can be on for Chrome and still fail here. Paste from Maps, or pin on the plan.";
        } else {
          msg = "This page was blocked from using location. Tap the lock icon near the address and allow Location, or Settings → Apps → Chrome → Permissions → Location.";
        }
      } else if (err && err.code === 2) {
        msg = "Position unavailable. Try again outdoors, or paste from Maps.";
      } else if (err && err.code === 3) {
        msg = "GPS timed out. Try again, or paste from Maps.";
      } else if (err && err.message) {
        msg = err.message;
      }
      const cur = snagById(s.id);
      const where = cur ? openFor(cur.id) : null;
      // Only the banner changes; typed coordinates stay. Elsewhere nothing is redrawn.
      if (where === "gps") gpsSheet(cur, msg, false, true);
      else if (where === "snag") UI.toast(msg, true, 6000);
    }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
  }

  function parseYmd(s) {
    const m = String(s || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (!m) return null;
    return { y: +m[1], m: +m[2] - 1, d: +m[3] };
  }
  function ymd(y, m, d) {
    return y + "-" + String(m + 1).padStart(2, "0") + "-" + String(d).padStart(2, "0");
  }
  function dateSheet(field, value, year, month) {
    const parsed = parseYmd(value);
    const now = new Date();
    const y = year != null ? year : (parsed ? parsed.y : now.getFullYear());
    const mo = month != null ? month : (parsed ? parsed.m : now.getMonth());
    App.dateField = field;
    App.dateValue = value || "";
    App.dateCursor = { y: y, m: mo };
    const first = new Date(y, mo, 1);
    const start = first.getDay(); // 0 Sun
    const days = new Date(y, mo + 1, 0).getDate();
    const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    let cells = ["Su","Mo","Tu","We","Th","Fr","Sa"].map(function (d) { return '<div class="dow">' + d + "</div>"; }).join("");
    for (let i = 0; i < start; i++) cells += "<div></div>";
    const todayStr = today();
    for (let d = 1; d <= days; d++) {
      const v = ymd(y, mo, d);
      const cls = (value === v ? " on" : "") + (todayStr === v ? " today" : "");
      cells += '<button type="button" class="' + cls.trim() + '" data-a="pick-date" data-v="' + esc(v) + '">' + d + "</button>";
    }
    const title = field === "due_date" ? "Due date" : field === "next_inspection_date" ? "Next inspection" : "Inspection date";
    UI.openModal(
      UI.sheetHead(title) +
      '<div class="sheet-b">' +
      '<div class="cal-nav">' +
      '<button class="btn btn-sm" data-a="date-prev">‹</button>' +
      "<b>" + esc(months[mo] + " " + y) + "</b>" +
      '<button class="btn btn-sm" data-a="date-next">›</button></div>' +
      '<div class="cal">' + cells + "</div>" +
      '<div class="btn-row" style="margin-top:12px">' +
      '<button class="btn" data-a="date-clear">Clear date</button>' +
      '<button class="btn" data-a="date-back">Back</button></div>' +
      "</div>"
    );
  }
  function dateBack() {
    if (App.modal && App.modal.type === "snag" && App.snagId) snagSheet(App.snagId);
    else { UI.closeModal(); UI.render(); }
  }

    "dup-tables": function () {
      const s = snagById(App.modal.id);
      const m = String(s.block_table || "").match(/^(.*?)(\d+)\s*$/);
      const prefix = m ? m[1] : (s.block_table ? s.block_table + " " : "Table ");
      const answer = prompt(
        "Copy this snag to which tables?\n\nType numbers or ranges: 4-18, or 4,7,9\n" +
        'Each copy is named "' + prefix.trim() + ' <n>".', m ? m[2] : "");
      if (!answer) return;
      const nums = [];
      answer.split(",").forEach(function (part) {
        part = part.trim();
        const range = part.match(/^(\d+)\s*[-–]\s*(\d+)$/);
        if (range) {
          const a = parseInt(range[1], 10), b = parseInt(range[2], 10);
          for (let n = Math.min(a, b); n <= Math.max(a, b); n++) nums.push(n);
        } else if (/^\d+$/.test(part)) nums.push(parseInt(part, 10));
      });
      if (!nums.length) return UI.toast("Could not read those table numbers", true);
      if (nums.length > 200) return UI.toast("That is more than 200 copies — narrow the range", true);
      const st = Store.get(), i = insp();
      let made = 0;
      nums.forEach(function (n) {
        const name = (prefix + n).trim();
        if (name === (s.block_table || "").trim()) return;   // don't duplicate onto itself
        st.snags.push(Model.snag(i, {
          risk: s.risk, category: s.category, description: s.description,
          required_action: s.required_action, block_table: name,
          location_text: s.location_text,
          references: JSON.parse(JSON.stringify(s.references || [])),
        }));
        made++;
      });
      Store.save(); UI.closeModal(); UI.render();
      UI.toast(made + " copies created — photos not copied");
    },

    /* ----------------------------------------------------------- data --- */
    "backup": async function (el) {
      const withPhotos = el.getAttribute("data-v") === "full";
      UI.toast("Preparing backup…", false, 20000);
      try {
        const made = await Store.backup(withPhotos);
        const blob = made.blob;
        const name = "LumaxPunchList_backup_" + today() + (withPhotos ? "_full.zip" : "_data.json");
        let how = "downloaded";
        if (el.hasAttribute("data-share")) how = await shareBuilt(blob, name);
        else saveBlob(blob, name);
        // Backing out of the share sheet saved nothing, so it is not a backup.
        if (how === "cancelled") return UI.hideToast();
        const s = Store.get().settings;
        // Edits made while the file was built are not in it.
        const editedSince = Date.parse(Store.get().updated_at) > Date.parse(made.at);
        s.last_backup_full = withPhotos;
        if (withPhotos) s.last_full_backup_at = made.at;
        Store.save();
        // save() has just stamped updated_at; take the same moment, so this
        // save is not itself counted as a change since the backup. The write
        // is debounced, so it still carries the value set here.
        s.last_backup_at = editedSince ? made.at : Store.get().updated_at;
        UI.render();
        UI.toast((how === "shared" ? "Backup shared · " : "Backup saved · ") + fmtBytes(blob.size));
      } catch (err) {
        UI.toast("Backup failed: " + (err.message || err), true, 7000);

    "hide-backup-nag": function () { App.backupNagHidden = true; UI.render(); },
    "restore": async function () {
      const files = await pickFile(".json,.zip,application/json,application/zip", false, true);
      if (!files.length) return;
      if (!confirm("Restore this backup into this device?\n\nCancel stops. Nothing will change.")) return;
      const mode = confirm("OK = replace everything here with the backup (photos it still uses are kept)\nCancel = merge, keeping what is already here") ? "replace" : "merge";
      try {
        const opened = await Store.openBackup(files[0]);
        const res = await Store.restore(opened.json, mode, opened.files);
        UI.clearUsage();
        App.route = "home"; App.inspId = null;
        UI.render();
        let msg = "Backup restored";
        // Say which numbers changed, so a report already sent under the old
        // number can still be matched up.
        const rn = res.renumbered || [];
        if (rn.length) {
          msg += " · " + rn.length + " inspection" + (rn.length > 1 ? "s" : "") + " renumbered: " +
            rn.map(function (r) { return r.from + " → " + r.to; }).join(", ");
        }
        // Two phones added snags to the same inspection: same reasoning.
        const rs = res.renumberedSnags || [];
        if (rs.length) {
          msg += " · " + rs.length + " snag" + (rs.length > 1 ? "s" : "") + " renumbered: " +
            rs.slice(0, 5).map(function (r) { return r.from + " → " + r.to; }).join(", ") +
            (rs.length > 5 ? " and " + (rs.length - 5) + " more (search the old code to find them)" : "");
        }
        if (res.missingPhotos && res.photosLeftOut) {
          // backup.json without its photos folder: the data is back, the photos are not.
          UI.toast(msg + " · " + res.missingPhotos + " photo" + (res.missingPhotos > 1 ? "s are" : " is") +
            " not on this device: that was backup.json on its own. Restore the original _full.zip to bring them back.", true, 9000);
        } else if (res.missingPhotos) {
          UI.toast(msg + " · " + res.missingPhotos + " photo" + (res.missingPhotos > 1 ? "s are" : " is") +
            " not on this device. Restore a full backup to bring them back.", true, 9000);
        } else {
          UI.toast(msg, false, rn.length || rs.length ? 9000 : 2600);
        }
      } catch (err) {
        UI.toast("Restore failed: " + (err.message || err), true, 8000);
      }
    },
    "cleanup": async function () {
      const orphans = await Store.orphans();
      if (!orphans.length) return UI.toast("No unused photos");
      if (!confirm("Remove " + orphans.length + " photos that no snag uses?")) return;
      for (const p of orphans) await Store.delPhoto(p.id);

    "wipe": async function () {
      if (!confirm("Erase every project, inspection, snag and photo on this device?\n\nBack up first — this cannot be undone.")) return;
      if (prompt('Type ERASE to confirm') !== "ERASE") return UI.toast("Cancelled");
      const photos = await Store.idbAll("photos");
      for (const p of photos) await Store.delPhoto(p.id);
      const fresh = Store.blank();

      await Store.flush();
      UI.clearUsage(); App.route = "home"; App.inspId = null; UI.render();
      UI.toast("Device erased");
    },
  };

  /* ------------------------------------------------------------ binding -- */
  UI.setFieldFlush(flushPendingField);
  function flushPendingField() {
    clearTimeout(typeTimer);
    const active = document.activeElement;
    const f = active && active.closest ? active.closest("[data-f]") : null;
    // Only real entry fields. A date button carries data-f too, but its
    // value is empty (the date lives in data-v), so applying it would clear the date.
    if (f && f.tagName !== "BUTTON") applyField(f.getAttribute("data-f"), f.value);
  }

  function applyField(name, value) {
    if ((name === "block_table" || name === "support_no" || name === "location_text" || name === "category" ||
      name === "description" || name === "required_action" || name === "contractor_response" ||
      name === "due_date" || name === "priority" || name === "risk") && !(App.modal && App.modal.type === "snag")) return;
    const st = Store.get();
    if (name.indexOf("s.") === 0) {
      const key = name.slice(2);
      st.settings[key] = (key === "photo_max_edge" || key === "photo_quality") ? Number(value) : value;
    } else if (name.indexOf("p.") === 0 && App.modal && App.modal.draft) {
      App.modal.draft[name.slice(2)] = value;
    } else if (name.indexOf("t.") === 0 && App.modal && App.modal.draft) {
      App.modal.draft[name.slice(2)] = value;
    } else if (name.indexOf("r.") === 0 && App.modal && App.modal.draft) {
      App.modal.draft[name.slice(2)] = value;
    } else if (name.indexOf("ph.") === 0) {
      const pid = name.slice(3);
      Store.getPhoto(pid).then(function (p) {
        if (!p) return;
        p.caption = value;
        Store.idbPut("photos", p);
        // Captions live with the photo, so only a full backup carries them.
        Store.get().settings.photos_changed_at = new Date().toISOString();
        Store.save();
      });
      return;
    } else if (name.indexOf("gps.") === 0 && App.modal && App.modal.type === "gps") {
      App.modal.draft = App.modal.draft || {};
      const key = name.slice(4);
      if (App.modal.draft[key] === value) return;
      App.modal.draft[key] = value;
      // Typed by hand, so a GPS fix still on its way must not overwrite it.
      App.modal.draft.typed = true;
      const box = function (k) { return document.querySelector('#modal [data-f="gps.' + k + '"]'); };
      if (key === "pair") {
        const c = parseCoords(value);
        if (c) {
          App.modal.draft.lat = String(c.lat); App.modal.draft.lng = String(c.lng);
          // Show the pasted pair in the boxes, so what Save will use is on screen.
          if (box("lat")) box("lat").value = App.modal.draft.lat;
          if (box("lng")) box("lng").value = App.modal.draft.lng;
        }
      } else {
        // The boxes were edited after a paste, so they win over the pasted pair.
        App.modal.draft.pair = "";
        if (box("pair")) box("pair").value = "";
      }
      return;
    } else if (App.modal && App.modal.type === "snag") {
      const s = snagById(App.modal.id);
      if (!s) return;
      s[name] = value;
      s.updated_at = new Date().toISOString();
      if (name === "description" || name === "block_table") {
        const row = document.querySelector('[data-a="open-snag"][data-id="' + CSS.escape(s.id) + '"] .desc');
        if (row && name === "description") row.textContent = value || "(no description yet)";
      }
    } else {
      const i = insp();
      if (!i) return;
      i[name] = value;
      if (name === "project_id") UI.chrome();
    }
    Store.save();
  }

  document.addEventListener("click", function (ev) {
    const el = ev.target.closest("[data-a]");
    if (!el) return;
    const a = el.getAttribute("data-a");
    if (actions[a]) {
      ev.preventDefault();
      actions[a](el, ev);
    }
  });

  document.addEventListener("change", function (ev) {
    const f = ev.target.closest("[data-f]");
    if (f) applyField(f.getAttribute("data-f"), f.value);
  });

  let typeTimer = null;
  document.addEventListener("input", function (ev) {
    const f = ev.target.closest("[data-f]");
    if (f && (f.tagName === "TEXTAREA" || f.type === "text")) {
      clearTimeout(typeTimer);
      const name = f.getAttribute("data-f"), v = f.value;
      typeTimer = setTimeout(function () { applyField(name, v); }, 320);
    }
    if (ev.target.id === "q") {
      App.query = ev.target.value;
      clearTimeout(typeTimer);
      typeTimer = setTimeout(function () {
        const pos = ev.target.selectionStart;
        UI.render();
        const el = document.getElementById("q");
        if (el) { el.focus(); el.setSelectionRange(pos, pos); }
      }, 300);
    }
  });

  // Segmented controls (risk, kind…)
  document.addEventListener("click", function (ev) {
    const b = ev.target.closest(".seg button");
    if (!b) return;
    const seg = b.closest(".seg");
    seg.querySelectorAll("button").forEach(function (x) { x.classList.remove("on"); });
    b.classList.add("on");
    applyField(seg.getAttribute("data-seg"), b.getAttribute("data-v"));
    if (seg.getAttribute("data-seg") === "risk") UI.render();
  });

  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape" && App.modal) { flushPendingField(); UI.closeModal(); UI.render(); }
  });

  // Save typed text too, not just the debounced state. Phones often kill a
  // backgrounded tab without beforeunload, so also save when it is hidden.
  function saveNow() {
    flushPendingField();
    Store.flush().catch(function () { });
  }
  window.addEventListener("beforeunload", saveNow);
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden") saveNow();
  });

  /* ------------------------------------------------------- one tab only -- */
  /* Each tab holds its own copy of the data, so two tabs editing at once
     would overwrite each other. A newly opened tab asks the open one to save
     and step aside; Store refuses any write from a tab that is out of date. */
  const TAB_LOCK = "lumax-punchlist-active";
  const channel = ("BroadcastChannel" in window) ? new BroadcastChannel("lumax-punchlist") : null;
  let releaseTab = null;

  const STALE_TEXT = {
    conflict: ["This data was changed in another tab",
      "Your last change here was not saved, so the other tab's work is not overwritten."],
    claimed: ["This app is open in another tab",
      "Everything here has been saved. Only one tab can make changes at a time."],
    draft: ["This app is open in another tab",
      "Only one tab can make changes at a time. Everything here has been saved except the form that was open, which was never saved."],
    failed: ["This app is open in another tab",
      "Your last changes here could not be saved. Only one tab can make changes at a time."],
    upgrade: ["A newer version of the app was opened in another tab",
      "Reload to continue. This tab has stopped saving so the newer version can update the data.", "Reload"],
  };

  function showStale(why) {
    if (document.getElementById("stale")) return;
    const t = STALE_TEXT[why];
    const d = document.createElement("div");
    d.id = "stale";
    d.className = "stale";
    d.innerHTML = '<div class="banner warn"><span>!</span><span><b>' + t[0] + "</b>" + t[1] +
      '<br><br><button class="btn btn-p" type="button">' + (t[2] || "Use this tab instead") + "</button></span></div>";
    d.querySelector("button").addEventListener("click", function () { location.reload(); });
    document.body.appendChild(d);
  }
  Store.onStale(function (why) { showStale(why || "conflict"); });

  async function claimTab() {
    if (!channel) return;
    channel.onmessage = async function (ev) {
      if (!ev.data || ev.data.type !== "claim") return;
      flushPendingField();
      const draftOpen = !!(App.modal && App.modal.draft);
      const ok = await Store.release();
      showStale(!ok ? "failed" : draftOpen ? "draft" : "claimed");
      if (releaseTab) { releaseTab(); releaseTab = null; }
    };
    channel.postMessage({ type: "claim" });
    if (!navigator.locks || !window.AbortController) return;
    // Wait for the open tab to finish saving, but not for ever: a tab asleep
    // on a phone may never answer, and Store's write check still covers that.
    const ctl = new AbortController();
    const timer = setTimeout(function () { ctl.abort(); }, 3000);
    try {
      await new Promise(function (res, rej) {
        navigator.locks.request(TAB_LOCK, { signal: ctl.signal }, function () {
          res();
          return new Promise(function (r) { releaseTab = r; });
        }).catch(rej);
      });
    } catch (e) { }
    clearTimeout(timer);
  }

  /* --------------------------------------------------------------- boot -- */
  async function boot() {
    // Reachable from the Chrome console for support: Lumax.Store.get()
    window.Lumax = {
      Store: Store, UI: UI, App: App, Report: Report, Model: Model, DocxKit: DocxKit,
      snagsOf: snagsOf, actions: actions, version: APP_VERSION,
    };
    // Keeps a copy of the app so the home-screen icon opens with no signal.
    // A downloaded file cannot have one; a failure here must not stop the app.
    if ("serviceWorker" in navigator && location.protocol !== "file:") {
      try {
        navigator.serviceWorker.register("sw.js").catch(function (e) { console.warn("Offline copy not set up:", e); });
      } catch (e) { }
    }
    document.getElementById("brandmark").src = "data:image/png;base64," + LUMAX_LOGO_B64;
    document.getElementById("btnHome").addEventListener("click", function () {
      App.route = "home"; App.inspId = null; App.placing = false; App.pinFor = null;
      UI.closeModal(); UI.render();
    });
    const sun = document.getElementById("btnSun");
    if (localStorage.getItem("lumax-sun") === "1") { document.body.classList.add("sun"); sun.classList.add("on"); }
    sun.addEventListener("click", function () {
      const on = document.body.classList.toggle("sun");
      sun.classList.toggle("on", on);
      try { localStorage.setItem("lumax-sun", on ? "1" : "0"); } catch (e) { }
    });

    try {
      await claimTab();
      await Store.load();
    } catch (err) {
      document.getElementById("view").innerHTML =
        '<div class="banner bad"><span>✕</span><span><b>This browser will not let the app store data</b>' +
        esc(err.message || String(err)) +
        "<br><br>Private/incognito windows and some locked-down profiles block storage. Open the file in a normal Chrome window.</span></div>";
      return;
    }
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persisted().then(function (p) { if (!p) navigator.storage.persist(); });
    }
    UI.render();
  }

  boot();
})();
</script>
</body>
</html>
