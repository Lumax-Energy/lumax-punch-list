    const cdSize = tail.getUint32(end + 12, true);
    const cdStart = tail.getUint32(end + 16, true);
    if (cdStart + cdSize > tailStart + end) throw new Error(ZIP_DAMAGED);
    const cd = await readRange(file, cdStart, cdStart + cdSize);
    const dec = new TextDecoder();
    const out = new Map();
    let pos = 0;
    for (let n = 0; n < count; n++) {
      if (pos + 46 > cd.byteLength || cd.getUint32(pos, true) !== 0x02014b50) throw new Error(ZIP_DAMAGED);
      const method = cd.getUint16(pos + 10, true);
      const crc = cd.getUint32(pos + 16, true);
      const size = cd.getUint32(pos + 20, true);
      const nameLen = cd.getUint16(pos + 28, true);
      const skip = nameLen + cd.getUint16(pos + 30, true) + cd.getUint16(pos + 32, true);
      const at = cd.getUint32(pos + 42, true);
      if (pos + 46 + skip > cd.byteLength) throw new Error(ZIP_DAMAGED);
      const name = dec.decode(new Uint8Array(cd.buffer, cd.byteOffset + pos + 46, nameLen));
      pos += 46 + skip;
      if (method !== 0) {
        throw new Error("This backup .zip was re-compressed by another app. Restore the file the app saved.");
      }
      // The local header can carry its own extra field, so the data starts
      // where that header says, not where the central copy implies.
      const local = await readRange(file, at, at + 30);
      if (local.byteLength < 30 || local.getUint32(0, true) !== 0x04034b50) throw new Error(ZIP_DAMAGED);
      const start = at + 30 + local.getUint16(26, true) + local.getUint16(28, true);
      if (start + size > cdStart) throw new Error(ZIP_DAMAGED);
      out.set(name, { blob: file.slice(start, start + size), crc: crc });
    }
    return out;
  }

  /** Returns { blob, at }. The data is copied first and `at` is that
   *  moment: reading every photo can take a while, and anything edited
   *  meanwhile is not in the file, so it must not count as backed up. */
  async function backup(withPhotos) {
    const at = new Date().toISOString();
    const copy = JSON.parse(JSON.stringify(state));
    // A device restored from this file has been backed up at `at`, so the
    // file carries this backup's own clocks, not the previous backup's.
    copy.settings.last_backup_at = at;
    copy.settings.last_backup_full = !!withPhotos;
    if (withPhotos) copy.settings.last_full_backup_at = at;
    const payload = {
      format: "lumax-punchlist-backup", version: 1, app_version: APP_VERSION, exported_at: at, state: copy, photos: [],
    };
    if (!withPhotos) return { blob: new Blob([JSON.stringify(payload)], { type: "application/json" }), at: at };
    const files = [];
    const names = new Set();
    const all = await idbAll("photos");
    for (const p of all) {
      const meta = {
        id: p.id, w: p.w, h: p.h, kind: p.kind, caption: p.caption, thumb: p.thumb,
        created_at: p.created_at, file: null,
      };
      if (p.blob) {
        // Ids are UUIDs, but one restored from an old file could hold
        // anything, so keep the path to safe characters and unique.
        const base = "photos/" + String(p.id).replace(/[^A-Za-z0-9_-]/g, "_");
        let name = base + ".jpg";
        for (let n = 2; names.has(name); n++) name = base + "-" + n + ".jpg";
        names.add(name);
        meta.file = name;
        files.push({ name: name, data: p.blob });
      }
      payload.photos.push(meta);
    }
    files.unshift({ name: "backup.json", data: new TextEncoder().encode(JSON.stringify(payload)) });
    return { blob: await zipBlob(files), at: at };
  }

  /** Read a backup file: a full backup .zip, or a .json (a data-only
   *  backup, or a full backup from before photos moved into a zip).
   *  Returns { json, files } where files maps zip paths to { blob, crc }. */
  async function openBackup(file) {
    const head = await toBytes(file.slice(0, 4));
    const isZip = head && head.length === 4 && head[0] === 0x50 && head[1] === 0x4b && head[2] === 3 && head[3] === 4;
    if (!isZip) return { json: JSON.parse(await file.text()), files: null };
    const entries = await unzipBlob(file);
    const main = entries.get("backup.json");
    if (!main) throw new Error("That .zip is not a Lumax Punch List backup.");
    const bytes = await toBytes(main.blob);
    if (DocxKit.crc32(bytes) !== main.crc) throw new Error(ZIP_DAMAGED);
    // Each photo keeps its CRC, so restore() can check its bytes too.
    return { json: JSON.parse(new TextDecoder().decode(bytes)), files: entries };
  }

  /** Each phone counts inspection numbers on its own, so a merge can bring
   *  in a different inspection under a number already used here. Give the
   *  backup's copy the next free number; commitRestore re-codes its snags.
   *  Inspections already on this device never change: their numbers may be
   *  on issued reports. Returns [{ from, to }]. */
  function renumberClashes(incoming, counters) {
    const localInsp = new Set(state.inspections.map(function (i) { return i.id; }));
    const claimed = new Set(state.inspections.map(function (i) { return i.number; }));
    // Every number in either copy, so a new number never lands on one the
    // backup itself uses further down the list.
    const taken = new Set(claimed);
    incoming.inspections.forEach(function (i) { taken.add(i.number); });
    const out = [];
    incoming.inspections.forEach(function (insp) {
      if (localInsp.has(insp.id) || !insp.number) return;
      if (!claimed.has(insp.number)) { claimed.add(insp.number); return; }
      // Keep the clashing number's own prefix and year when it has them.
      const m = /^(.*)-(\d{4})-\d+$/.exec(insp.number);
      const prefix = m ? m[1] : (state.settings.inspection_prefix || "LUX");
      const year = m ? m[2] : String(new Date().getFullYear());
      const head = prefix + "-" + year + "-";
      let n = Number(counters[year]) || 0;
      taken.forEach(function (x) {
        if (typeof x === "string" && x.indexOf(head) === 0) n = Math.max(n, parseInt(x.slice(head.length), 10) || 0);
      });
      let to;
      do { n++; to = head + String(n).padStart(6, "0"); } while (taken.has(to));
      counters[year] = n;
      taken.add(to); claimed.add(to);
      const from = insp.number;
      insp.number = to;
      // Kept on the record, so a report already issued under the old number
      // can still be traced to this inspection after the toast has gone.
      insp.previous_numbers = (insp.previous_numbers || []).concat(from);
      out.push({ from: from, to: to });
    });
    return out;
  }

  /** Snag codes start with the inspection number. A new snag from a backup
   *  can belong to an inspection numbered differently here: renumbered in
   *  this merge, or in an earlier merge from the same phone, which still
   *  uses the old number. Move the front of its code to this device's
   *  number, so no two snags here share a code. */
  function recodeSnags(snags, inspections, backupNumber) {
    const numberOf = new Map(inspections.map(function (i) { return [i.id, i.number]; }));
    snags.forEach(function (sn) {
      const to = numberOf.get(sn.inspection_id);
      if (!to || (sn.code && sn.code.indexOf(to + "-") === 0)) return;
      const from = backupNumber.get(sn.inspection_id);
      let code = sn.code;
      if (sn.snag_number != null) code = to + "-" + String(sn.snag_number).padStart(3, "0");
      else if (from && sn.code && sn.code.indexOf(from + "-") === 0) code = to + sn.code.slice(from.length);
      if (code === sn.code) return;
      if (sn.code) sn.previous_codes = (sn.previous_codes || []).concat(sn.code);
      sn.code = code;
    });
  }

  /** Two phones adding snags to the same shared inspection both issue the
   *  same next number, so a merge can bring in a second snag 6. Give each
   *  clashing new snag the next free number in its inspection. Snags already
   *  on this device keep theirs: they may be on issued reports. Also raise
   *  each inspection's last_snag_number past every snag it now has, so the
   *  next snag made here cannot clash either. Inspections already here are
   *  copied before changing, so a failed save leaves the state untouched.
   *  Returns [{ from, to }] codes. */
  function renumberSnagClashes(next, added, incoming) {
    const isAdded = new Set(added.map(function (sn) { return sn.id; }));
    const backupLast = new Map(incoming.inspections.map(function (i) { return [i.id, Number(i.last_snag_number) || 0]; }));
    // Numbers already used in each inspection by snags that were here before.
    const used = new Map();
    next.snags.forEach(function (sn) {
      if (isAdded.has(sn.id) || sn.snag_number == null) return;
      if (!used.has(sn.inspection_id)) used.set(sn.inspection_id, new Set());
      used.get(sn.inspection_id).add(sn.snag_number);
    });
    const byInsp = new Map();
    added.forEach(function (sn) {
      if (!byInsp.has(sn.inspection_id)) byInsp.set(sn.inspection_id, []);
      byInsp.get(sn.inspection_id).push(sn);
    });
    const out = [];
    next.inspections = next.inspections.map(function (insp) {
      const fresh = byInsp.get(insp.id);
      if (!fresh) return insp;
      const taken = used.get(insp.id) || new Set();
      // Start above every number either copy has used, including deleted snags.
      let top = Math.max(Number(insp.last_snag_number) || 0, backupLast.get(insp.id) || 0);
      taken.forEach(function (n) { top = Math.max(top, n); });
      fresh.forEach(function (sn) { if (sn.snag_number != null) top = Math.max(top, sn.snag_number); });
      fresh.forEach(function (sn) {
        if (sn.snag_number == null) return;
        if (taken.has(sn.snag_number)) {
          top++;
          const from = sn.code;
          sn.snag_number = top;
          sn.code = insp.number + "-" + String(top).padStart(3, "0");
          // Kept, so a report or message that used the old code still finds it.
          if (from) sn.previous_codes = (sn.previous_codes || []).concat(from);
          out.push({ from: from || "", to: sn.code });
        }
        taken.add(sn.snag_number);
      });
      if ((Number(insp.last_snag_number) || 0) === top) return insp;
      return Object.assign({}, insp, { last_snag_number: top });
    });
    return out;
  }

  /** Swap in the restored state and save it. On failure the state in
   *  memory is put back, so a later save cannot write a half restore.
   *  Returns the backup's inspections and snags that a merge had to
   *  renumber: { inspections: [{ from, to }], snags: [{ from, to }] }. */
  async function commitRestore(incoming, mode) {
    let next;
    let renumbered = [];
    let snagsRenumbered = [];
    if (mode === "replace") {
      next = incoming;
    } else {
      // Merge: keep everything already here, add what is missing by id.
      next = Object.assign({}, state);
      const localC = (state.counters && typeof state.counters === "object" && !Array.isArray(state.counters)) ? state.counters : {};
      const inC = (incoming.counters && typeof incoming.counters === "object" && !Array.isArray(incoming.counters)) ? incoming.counters : {};
      const merged = {};
      Object.keys(localC).concat(Object.keys(inC)).forEach(function (y) {
        merged[y] = Math.max(Number(localC[y]) || 0, Number(inC[y]) || 0);
      });
      // The number each inspection has in the backup, before any renumbering.
      const backupNumber = new Map(incoming.inspections.map(function (i) { return [i.id, i.number]; }));
      renumbered = renumberClashes(incoming, merged);
      const added = [];
      ["projects", "inspections", "snags", "revisions", "templates", "remarks"].forEach(function (k) {
        const have = new Set(state[k].map(function (x) { return x.id; }));
        const fresh = incoming[k].filter(function (x) { return !have.has(x.id); });
        if (k === "snags") added.push.apply(added, fresh);
        next[k] = state[k].concat(fresh);
      });
      next.counters = merged;
      recodeSnags(added, next.inspections, backupNumber);
      snagsRenumbered = renumberSnagClashes(next, added, incoming);
    }
    const prev = state;
    state = next;
    try {
      await flush();
    } catch (err) {
      state = prev;
      throw err;
    }
    return { inspections: renumbered, snags: snagsRenumbered };
  }

  /** `files` is the zip's path → { blob, crc } map from openBackup(); null
   *  for a .json backup, whose photos (if any) are base64 inside it. */
  async function restore(json, mode, files) {
    if (!json || json.format !== "lumax-punchlist-backup") {
      throw new Error("That file is not a Lumax Punch List backup.");
    }
    const incoming = migrate(json.state || {});
    // Check every photo before anything here changes, so a damaged file
    // fails cleanly instead of half way through.
    // Photo ids end up in attributes and the thumb in an img src, so they
    // get the same type checks as the state.
    // A size must be a positive number: the Word export divides by it.
    const size = function (v) { const n = asNum(v); return n > 0 ? n : null; };
    // Only the photo details are kept here, not the bytes: a zip photo is
    // read once to check it and read again when it is saved, so a phone
    // never holds the whole photo library in memory at once.
    const photos = [];
    let skipped = 0;
    for (const p of (Array.isArray(json.photos) ? json.photos : [])) {
      if (!isObj(p) || p.id == null || p.id === "") continue;
      let part = null;
      let blob = null;
      if (p.file != null && p.file !== "") {
        // backup.json on its own: the phone or computer unzipped the backup
        // and kept only the folder. Restore the data; the photos show up as
        // missing rather than blocking everything else.
        if (!files) { skipped++; continue; }
        part = files.get(String(p.file));
        if (!part) throw new Error("The backup is missing the photo file " + p.file + ".");
        // Read and check each photo now, one at a time, then let the bytes
        // go: damaged bytes never replace a good photo here.
        const bytes = await toBytes(part.blob);
        if (!bytes || DocxKit.crc32(bytes) !== part.crc) throw new Error(ZIP_DAMAGED);
      } else {
        blob = b64ToBlob(p.data, "image/jpeg");
      }
      photos.push({
        id: String(p.id), part: part, blob: blob,
        thumb: typeof p.thumb === "string" && p.thumb.indexOf("data:image/") === 0 ? p.thumb : null,
        w: size(p.w), h: size(p.h),
        kind: p.kind === "after" || p.kind === "closeout" ? p.kind : "before",
        caption: p.caption == null ? "" : String(p.caption), created_at: p.created_at == null ? "" : String(p.created_at),
      });
    }
    // The stored record for one photo. A zip photo is read again and copied
    // into its own Blob, so the saved photo does not depend on the picked
    // file staying readable. It is checked again too, in case the file
    // changed since the first pass.
    const record = async function (m) {
      let blob = m.blob;
      if (m.part) {
        const bytes = await toBytes(m.part.blob);
        if (!bytes || DocxKit.crc32(bytes) !== m.part.crc) throw new Error(ZIP_DAMAGED);
        blob = new Blob([bytes], { type: "image/jpeg" });
      }
      return {
        id: m.id, blob: blob, thumb: m.thumb, w: m.w, h: m.h,
        kind: m.kind, caption: m.caption, created_at: m.created_at,
      };
    };
    // Add the backup's new photos before deleting or changing any. If anything
    // fails before the restored state is saved, the ones added are removed
    // again, so the device is left exactly as it was.
    const added = [];
    const overwrite = [];   // replace: ids already here, updated only once committed
    let renumbered = { inspections: [], snags: [] };
    try {
      for (const p of photos) {
        if (await idbHas("photos", p.id)) {
          if (mode === "replace") overwrite.push(p);
          continue;
        }
        // One photo at a time: read, save, and wait for the save to commit
        // before the next is read.
        await idbPutDone("photos", await record(p));
        added.push(p.id);
      }
      renumbered = await commitRestore(incoming, mode);
    } catch (err) {
      for (const id of added) { try { await idbDel("photos", id); } catch (e) { } }
      throw err;
    }
    // The data is saved now, so a photo that cannot be read again keeps the
    // copy already on this device rather than undoing the restore.
    for (const p of overwrite) { try { await idbPutDone("photos", await record(p)); } catch (e) { } }

    // Only now drop photos the restored data no longer uses. A data-only
    // backup carries no photos, so the ones it still points at stay.
    const keep = referenced(state);
    photos.forEach(function (p) { keep.add(p.id); });
    let present = await idbKeys("photos");
    if (mode === "replace") {
      urlCache.forEach(function (u) { URL.revokeObjectURL(u); });
      urlCache.clear();
      for (const id of present) {
        if (!keep.has(id)) { try { await idbDel("photos", id); } catch (e) { } }
      }
      present = await idbKeys("photos");
    }
    const have = new Set(present);
    let missing = 0;
    referenced(state).forEach(function (id) { if (!have.has(id)) missing++; });
    return { missingPhotos: missing, renumbered: renumbered.inspections, renumberedSnags: renumbered.snags, photosLeftOut: skipped };
  }

  async function usage() {
    let quota = 0, used = 0;
    if (navigator.storage && navigator.storage.estimate) {
      try { const e = await navigator.storage.estimate(); quota = e.quota || 0; used = e.usage || 0; } catch (err) { }
    }
    // null = this browser cannot say, which the screen treats as unknown.
    let persisted = null;
    if (navigator.storage && navigator.storage.persisted) {
      try { persisted = await navigator.storage.persisted(); } catch (err) { }
    }
    const photos = await photoTotals();
    return { quota: quota, used: used, photoCount: photos.count, photoBytes: photos.bytes, persisted: persisted };
  }
  // Walk the photos one at a time to add up their sizes, rather than loading
  // every photo and its thumbnail into memory at once just to read blob.size.
  function photoTotals() {
    return new Promise(function (res, rej) {
      let count = 0, bytes = 0;
      const r = tx("photos", "readonly").openCursor();
      r.onsuccess = function () {
        const c = r.result;
        if (!c) { res({ count: count, bytes: bytes }); return; }
        count++;
        bytes += (c.value && c.value.blob && c.value.blob.size) || 0;
        c.continue();
      };
      r.onerror = function () { rej(r.error); };
    });
  }

  /** Ids of every photo a snag or inspection in `s` points at. */
  function referenced(s) {
    const ids = new Set();
    s.snags.forEach(function (sn) { (sn.photos || []).forEach(function (id) { ids.add(id); }); });
    s.inspections.forEach(function (i) {
      (i.photos || []).forEach(function (id) { ids.add(id); });
      if (i.site_photo_id) ids.add(i.site_photo_id);
      if (i.site_plan_id) ids.add(i.site_plan_id);
    });
    return ids;
  }

  /** Photos no longer referenced by any snag or inspection. */
  async function orphans() {
    const used = referenced(state);
    const all = await idbAll("photos");
    return all.filter(function (p) { return !used.has(p.id); });
  }

  return {
    load: load, get: get, save: save, flush: flush, blank: blank,
    release: release, onStale: onStale,
    addPhoto: addPhoto, getPhoto: getPhoto, delPhoto: delPhoto,
    photoUrl: photoUrl, photoThumb: photoThumb, photoBytes: photoBytes, photoIds: photoIds,
    backup: backup, openBackup: openBackup, restore: restore, usage: usage, orphans: orphans,
    idbAll: idbAll, idbPut: idbPut,
  };
})();

/* ------------------------------------------------------------- helpers --- */
function uid() {
  if (crypto && crypto.randomUUID) return crypto.randomUUID();
  return "id-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
}
/** Blob → bytes. Not every browser gives a Blob with arrayBuffer(), and a
 *  record restored from a backup may already be raw bytes, so cover all three. */
function toBytes(src) {
  if (!src) return Promise.resolve(null);
  if (ArrayBuffer.isView(src)) {
    return Promise.resolve(new Uint8Array(src.buffer, src.byteOffset, src.byteLength));
  }
  if (typeof src.byteLength === "number" && !src.size && !src.type) {
    return Promise.resolve(new Uint8Array(src));
  }
  if (typeof src.arrayBuffer === "function") {
    return src.arrayBuffer().then(function (b) { return new Uint8Array(b); });
  }
  return new Promise(function (res, rej) {
    const r = new FileReader();
    r.onload = function () { res(new Uint8Array(r.result)); };
    r.onerror = function () { rej(r.error); };
    r.readAsArrayBuffer(src);
  });
}
function bytesToB64(bytes) {
  let out = "";
  const step = 0x8000;                       // chunked: btoa chokes on huge arrays
  for (let i = 0; i < bytes.length; i += step) {
    out += String.fromCharCode.apply(null, bytes.subarray(i, i + step));
  }
  return btoa(out);
}
function blobToB64(blob) {
  return toBytes(blob).then(function (b) { return b ? bytesToB64(b) : ""; });
}
function b64ToBlob(b64, type) {
  const bin = atob(b64 || "");
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: type || "application/octet-stream" });
}
function fmtBytes(n) {
  if (!n) return "0 KB";
  if (n < 1024 * 1024) return Math.round(n / 1024) + " KB";
  if (n < 1024 * 1024 * 1024) return (n / 1024 / 1024).toFixed(1) + " MB";
  return (n / 1024 / 1024 / 1024).toFixed(2) + " GB";
}
function today() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
/** A stored timestamp (ISO, UTC) as this device's local date, or date and time. */
function localStamp(iso, withTime) {
  const d = new Date(iso || "");
  if (!iso || isNaN(d.getTime())) return "";
  const p2 = function (n) { return String(n).padStart(2, "0"); };
  const date = d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate());
  return withTime ? date + " " + p2(d.getHours()) + ":" + p2(d.getMinutes()) : date;
}
function esc(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

/* ------------------------------------------------------------- records --- */
const Model = {
  project: function (o) {
    return Object.assign({
      id: uid(), code: "", name: "", client_name: "", location: "", status: "active",
      areas: [], created_at: new Date().toISOString(),
    }, o || {});
  },

  nextInspectionNumber: function () {
    const st = Store.get();
    const year = new Date().getFullYear();
    if (!st.counters || typeof st.counters !== "object") st.counters = {};
    const prefix = st.settings.inspection_prefix || "LUX";
    const head = prefix + "-" + year + "-";
    let highest = 0;
    (st.inspections || []).forEach(function (i) {
      const n = i && i.number;
      if (typeof n !== "string" || n.indexOf(head) !== 0) return;
      const num = parseInt(n.slice(head.length), 10);
      if (num > highest) highest = num;
    });
    const next = Math.max(st.counters[year] || 0, highest) + 1;
    st.counters[year] = next;
    return head + String(next).padStart(6, "0");
  },

  inspection: function (o) {
    return Object.assign({
      id: uid(), number: Model.nextInspectionNumber(), project_id: "", area: "",
      type: INSPECTION_TYPES[1], inspection_date: today(), next_inspection_date: "",
      inspector_name: Store.get().settings.inspector_name || "", client_qc_name: "",
      status: "draft", general_remarks: "", technical_notes: "",
      site_photo_id: "", site_plan_id: "", photos: [], rev: 0,
      created_at: new Date().toISOString(),
    }, o || {});
  },

  snag: function (inspection, o) {
    const st = Store.get();
    const mine = st.snags.filter(function (s) { return s.inspection_id === inspection.id; });
    // last_snag_number only ever goes up, so deleting the newest snag does
    // not hand its number and code to the next one.
    const n = mine.reduce(function (m, s) { return Math.max(m, s.snag_number || 0); },
      Number(inspection.last_snag_number) || 0) + 1;
    inspection.last_snag_number = n;
    return Object.assign({
      id: uid(), inspection_id: inspection.id, snag_number: n,
      code: inspection.number + "-" + String(n).padStart(3, "0"),
      block_table: "", support_no: "", location_text: "",
      lat: null, lng: null, gps_accuracy: null, pin_x: null, pin_y: null,
      category: "", risk: "HR", description: "", required_action: "",
      contractor_response: "", status: "open", due_date: "", priority: "normal",
      references: [], photos: [], history: [],
      created_at: new Date().toISOString(), updated_at: new Date().toISOString(),
    }, o || {});
  },
};

/* ---------------------------------------------------------- selectors --- */
function projectOf(insp) {
  return Store.get().projects.find(function (p) { return p.id === insp.project_id; }) || Model.project({ name: "—" });
}
function snagsOf(inspectionId) {
  return Store.get().snags
    .filter(function (s) { return s.inspection_id === inspectionId; })
    .sort(function (a, b) { return a.snag_number - b.snag_number; });
}
function inspectionsOf(projectId) {
  return Store.get().inspections
    .filter(function (i) { return i.project_id === projectId; })
    .sort(function (a, b) { return (b.inspection_date || "").localeCompare(a.inspection_date || ""); });
}
/** Past its due date and not yet verified/closed. Due dates are local
 *  YYYY-MM-DD strings, so a plain string compare against today() works. */
function isOverdue(s) {
  return !!s.due_date && s.due_date < today() && DONE.indexOf(s.status) < 0;
}
function tally(snags) {
  const t = { total: snags.length, open: 0, hrOpen: 0, done: 0, prog: 0, overdue: 0 };
  snags.forEach(function (s) {
    if (isOverdue(s)) t.overdue++;
    if (DONE.indexOf(s.status) >= 0) t.done++;
    else if (s.status === "open") { t.open++; if (s.risk === "HR") t.hrOpen++; }
    else { t.prog++; if (s.risk === "HR") t.hrOpen++; }
  });
  t.outstanding = t.open + t.prog;
  return t;
}
function locationLine(s) {
  const parts = [];
  if (s.block_table) parts.push(s.block_table);
  if (s.support_no) parts.push("Supp. No. " + s.support_no);
  if (s.location_text) parts.push(s.location_text);
  if (s.lat != null && s.lng != null) parts.push("GPS " + Number(s.lat).toFixed(6) + ", " + Number(s.lng).toFixed(6));
  return parts.join(" — ");
}
function refsLine(s) {
  return (s.references || []).map(function (r) {
    return r.document + (r.detail ? " (" + r.detail + ")" : "");
  }).filter(Boolean).join("; ");
}
/* ============================================================================
   Reports. Same layout as the server build: revision header, project table,
   cover photo, legends, snag summary, Problems & Pictures, site top view with
   numbered pins, remarks, technical notes, sign-off. Built here in the browser
   so it works with no signal and no server.
   ========================================================================== */
const Report = (function () {
  "use strict";
  const K = DocxKit;
  const W = 10080;                       // content width in twips (178 mm)
  const NAVY = "0F304A", STEEL = "156082", HR = "B42318", LR = "B54708", OK = "027A48";
  const BAND = "E8EDF2";
  const riskHex = function (r) { return r === "HR" ? HR : LR; };
  const isDone = function (s) { return DONE.indexOf(s.status) >= 0; };

  function packLabel(mode) {
    return mode === "open" ? "OPEN ITEMS ONLY" : mode === "closeout" ? "CLOSE-OUT PACK" : "";
  }

  function filterSnags(all, mode) {
    if (mode === "open") return all.filter(function (s) { return !isDone(s); });
    if (mode === "closeout") return all.filter(isDone);
    return all;
  }

  /* -------------------------------------------------------- site map --- */
  /** Draw the plan with numbered, risk-coloured pins (green once verified).
   *  Returns {bytes,w,h} for Word, or null when there is nothing to draw. */
  async function renderMap(insp, snags) {
    const pinned = snags.filter(function (s) { return s.pin_x != null && s.pin_y != null; });
    const planId = insp.site_plan_id;
    if (!planId && !pinned.length) return null;

    const cw = 1400;
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");
    let img = null;
    if (planId) {
      const url = await Store.photoUrl(planId);
      if (url) {
        img = await new Promise(function (res) {
          const i = new Image();
          i.onload = function () { res(i); };
          i.onerror = function () { res(null); };
          i.src = url;
        });
      }
    }
    if (img) {
      canvas.width = cw;
      canvas.height = Math.max(1, Math.round(img.naturalHeight * (cw / img.naturalWidth)));
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    } else {
      canvas.width = cw; canvas.height = 1000;
      ctx.fillStyle = "#E8EDF2"; ctx.fillRect(0, 0, cw, 1000);
      ctx.strokeStyle = "#D0D9E2"; ctx.lineWidth = 2;
      for (let x = 0; x <= cw; x += 100) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 1000); ctx.stroke(); }
      for (let y = 0; y <= 1000; y += 100) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(cw, y); ctx.stroke(); }
    }

    const r = 26;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = "700 32px system-ui, sans-serif";
    pinned.forEach(function (s) {
      const x = s.pin_x * canvas.width, y = s.pin_y * canvas.height;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fillStyle = isDone(s) ? "#027A48" : (s.risk === "HR" ? "#B42318" : "#B54708");
      ctx.fill();
      ctx.lineWidth = 4; ctx.strokeStyle = "#fff"; ctx.stroke();
      ctx.fillStyle = "#fff";
      ctx.fillText(String(s.snag_number), x, y + 1);
    });

    const blob = await new Promise(function (res) { canvas.toBlob(res, "image/jpeg", 0.88); });
    if (!blob) return null;
    const buf = await blob.arrayBuffer();
    return { bytes: new Uint8Array(buf), ext: "jpeg", w: canvas.width, h: canvas.height };
  }

  /* ------------------------------------------------------------ word --- */
  async function buildDocx(insp, mode, revNumber) {
    const st = Store.get();
    const set = st.settings;
    const project = projectOf(insp);
    const all = snagsOf(insp.id);
    const snags = filterSnags(all, mode);
    const doc = new K.Doc({
      footer: (set.company_footer || "") + "  ·  " + insp.number + " Rev " + revNumber,
      title: set.report_title || "PUNCH LIST REPORT",
      author: set.company_name || "Lumax Energy",
    });

    /* header band ------------------------------------------------------- */
    const logo = doc.picture(
      { bytes: b64Bytes(LUMAX_LOGO_B64), ext: "png", w: LUMAX_LOGO_W, h: LUMAX_LOGO_H }, 52);
    const right = [
      K.text(set.report_title || "PUNCH LIST REPORT", { size: 15, bold: true, color: NAVY, align: "right", spaceAfter: 2 }),
      K.text("Revision: " + revNumber + "        Date: " + (insp.inspection_date || ""), { size: 10, align: "right", spaceAfter: 1 }),
      insp.next_inspection_date ? K.text("Next revision: " + insp.next_inspection_date, { size: 10, align: "right", spaceAfter: 1 }) : "",
      K.text("Inspection No: " + insp.number, { size: 10, bold: true, align: "right" }),
      // A merge renumbered it: the old number may be on reports already sent.
      (insp.previous_numbers || []).length
        ? K.text("Formerly: " + insp.previous_numbers.join(", "), { size: 9, align: "right" }) : "",
    ].join("");
    doc.add(K.table([3400, 6680], [K.row([
      K.cell(logo ? K.para(logo) : K.text(set.company_name || "", { size: 12, bold: true, color: NAVY }),
        { w: 3400, noBorder: true }),
      K.cell(right, { w: 6680, noBorder: true }),
    ])], { borders: false }));

    const ml = packLabel(mode);
    if (ml) doc.add(K.text(ml, { size: 11, bold: true, color: STEEL, align: "center" }));

    /* project information ---------------------------------------------- */
    const infoRows = [
      ["Project", project.name || "—", "Project code", project.code || "—"],
      ["Project area", insp.area || "—", "Client", project.client_name || "—"],
      ["Inspection type", insp.type || "—", "Inspection date", insp.inspection_date || "—"],
      ["Inspector (" + (set.company_name || "Lumax Energy") + ")", insp.inspector_name || "—",
        "Client/Contractor QC", insp.client_qc_name || "—"],
    ].map(function (r) {
      return K.row([
        K.cell(K.text(r[0], { size: 9, bold: true }), { w: 2200, bg: BAND }),
        K.cell(K.text(r[1], { size: 9 }), { w: 2840 }),
        K.cell(K.text(r[2], { size: 9, bold: true }), { w: 2200, bg: BAND }),
        K.cell(K.text(r[3], { size: 9 }), { w: 2840 }),
      ]);
    });
    doc.add(K.table([2200, 2840, 2200, 2840], infoRows));

    /* cover photo ------------------------------------------------------- */
    if (insp.site_photo_id) {
      const cover = await Store.photoBytes(insp.site_photo_id);
      const pic = cover && doc.picture(cover, 176, 100);
      if (pic) {
        doc.add(K.para(pic, { align: "center", spaceAfter: 2 }));
        if (cover.caption) doc.add(K.text(cover.caption, { size: 9, align: "center" }));
      }
    }

    /* legends ----------------------------------------------------------- */
    doc.add(K.text("Status Code Legend", { size: 11, bold: true, color: NAVY }));
    (set.risk_legend || "").split(";").forEach(function (item) {
      item = item.trim();
      if (item) doc.add(K.text(item, { size: 10, bold: true, spaceAfter: 1, color: /high/i.test(item) ? HR : LR }));
    });
    if (set.legend) doc.add(K.text("Legend: " + set.legend, { size: 9, spaceAfter: 8 }));

    /* summary ----------------------------------------------------------- */
    const t = tally(all);
    doc.add(K.text("Summary: " + t.total + " snags — " + t.outstanding + " open (" + t.hrOpen +
      " high risk), " + t.done + " verified/closed.", { size: 10, bold: true }));

    /* snag summary table ------------------------------------------------ */
    // Widths must add up to W. Due takes its 1100 from Block/Table, Impact
    // and Description; a YYYY-MM-DD date fits on one line at 9 pt.
    const head = ["Snag ID", "Block/Table", "Impact", "Description", "Due", "Status"];
    const cw = [1500, 1300, 800, 3880, 1100, 1500];
    const rows = [K.row(head.map(function (h, i) {
      return K.cell(K.text(h, { size: 9, bold: true, color: "FFFFFF" }), { w: cw[i], bg: NAVY });
    }), { header: true })];
    snags.forEach(function (s) {
      const loc = locationLine(s);
      rows.push(K.row([
        K.cell(K.text(String(s.snag_number).padStart(3, "0") + " (" + s.code + ")", { size: 8 }), { w: cw[0] }),
        K.cell(K.text(s.block_table || "—", { size: 9 }), { w: cw[1] }),
        K.cell(K.text(s.risk, { size: 9, bold: true, color: riskHex(s.risk) }), { w: cw[2] }),
        K.cell(K.text(s.description + (loc ? " [" + loc + "]" : ""), { size: 9 }), { w: cw[3] }),
        K.cell(K.text(s.due_date || "—", { size: 9, bold: isOverdue(s), color: isOverdue(s) ? HR : undefined }), { w: cw[4] }),
        K.cell(K.text(STATUS_LABEL[s.status] || s.status, { size: 9, color: STATUS_HEX[s.status] }), { w: cw[5] }),
      ]));
    });
    if (!snags.length) {
      rows.push(K.row([K.cell(K.text(mode === "open" ? "No open items." : "No items in this pack.",
        { size: 9, align: "center" }), { w: W, span: 6 })]));
    }
    doc.add(K.table(cw, rows));

    /* problems & pictures ----------------------------------------------- */
    if (snags.length) {
      doc.add(K.pageBreak());
      doc.add(K.text("Problems & Pictures", { size: 13, bold: true, color: NAVY }));
      const caption = function (p) { return p && p.caption ? K.text(p.caption, { size: 8, align: "center" }) : ""; };
      const pp = [];
      for (let i = 0; i < snags.length; i += 2) {
        const pair = snags.slice(i, i + 2);
        const imgCells = [], txtCells = [];
        for (let j = 0; j < 2; j++) {
          const s = pair[j];
          if (!s) { imgCells.push(K.cell("", { w: 5040 })); txtCells.push(K.cell("", { w: 5040 })); continue; }
          const shots = await photosFor(s);
          // Close-out and after shots are evidence of the fix and go under
          // "Close-out evidence", so they are not reused as the problem photo,
          // except in the open-items pack, which has no evidence section.
          const isEvidence = function (p) { return p.kind === "closeout" || p.kind === "after"; };
          const before = shots.find(function (p) { return p.kind === "before"; }) ||
            shots.find(function (p) { return !isEvidence(p); }) ||
            (mode === "open" ? shots[0] : null) || null;
          const pic = before && doc.picture(before, 78, 62);
          imgCells.push(K.cell(pic ? K.para(pic, { align: "center" }) + caption(before)
            : K.text("No photograph", { size: 9, align: "center" }), { w: 5040 }));

          const bits = [K.text(s.code + " — " + s.risk, { size: 9, bold: true, color: riskHex(s.risk) })];
          bits.push(K.text(s.description, { size: 9, spaceAfter: 2 }));
          const loc = locationLine(s);
          if (loc) bits.push(K.text("Location: " + loc, { size: 8, spaceAfter: 2 }));
          if (s.category) bits.push(K.text("Category: " + s.category, { size: 8, spaceAfter: 2 }));
          if (s.required_action) bits.push(K.text("Required action: " + s.required_action, { size: 9, spaceAfter: 2 }));
          const rl = refsLine(s);
          if (rl) bits.push(K.text("Reference: " + rl, { size: 8, spaceAfter: 2 }));
          if (s.contractor_response) bits.push(K.text("Contractor response: " + s.contractor_response, { size: 8, spaceAfter: 2 }));
          // Due date and priority on one line; "overdue" is as of the day the report is made.
          const late = isOverdue(s);
          const sched = [];
          if (s.due_date) sched.push("Due: " + s.due_date + (late ? " (overdue)" : ""));
          if (s.priority) sched.push("Priority: " + s.priority.charAt(0).toUpperCase() + s.priority.slice(1));
          if (sched.length) bits.push(K.text(sched.join("  ·  "), { size: 8, bold: late, color: late ? HR : undefined, spaceAfter: 2 }));
          bits.push(K.text("Status: " + (STATUS_LABEL[s.status] || s.status), {
            size: 8, bold: true, color: STATUS_HEX[s.status], spaceAfter: 2,
          }));
          const closeout = shots.filter(isEvidence);
          if (closeout.length && mode !== "open") {
            bits.push(K.text("Close-out evidence:", { size: 8, bold: true, spaceAfter: 1 }));
            const cp = doc.picture(closeout[0], 50, 42);
            if (cp) bits.push(K.para(cp, { align: "center" }) + caption(closeout[0]));
          }
          const last = (s.history || []).slice(-1)[0];
          if (last && last.at) {
            bits.push(K.text(STATUS_LABEL[last.to] + " " + localStamp(last.at) +
              (last.by ? " · " + last.by : "") + (last.comment ? " · " + last.comment : ""),
              { size: 7.5, color: "6B7F8F" }));
          }
          txtCells.push(K.cell(bits.join(""), { w: 5040 }));
        }
        pp.push(K.row(imgCells));
        pp.push(K.row(txtCells));
      }
      doc.add(K.table([5040, 5040], pp));
    }

    /* site top view ------------------------------------------------------ */
    const map = await renderMap(insp, snags);
    if (map) {
      doc.add(K.pageBreak());
      doc.add(K.text("Site Top View", { size: 13, bold: true, color: NAVY }));
      const mp = doc.picture(map, 175, 190);
      if (mp) doc.add(K.para(mp, { align: "center" }));
      const pw = [800, 3480, 2400, 3400];
      const prows = [K.row(["Pin", "Snag ID", "Impact", "Status"].map(function (h, i) {
        return K.cell(K.text(h, { size: 9, bold: true }), { w: pw[i], bg: BAND });
      }), { header: true })];
      snags.forEach(function (s) {
        if (s.pin_x == null) return;
        prows.push(K.row([
          K.cell(K.text(String(s.snag_number), { size: 9, align: "center" }), { w: pw[0] }),
          K.cell(K.text(s.code, { size: 8 }), { w: pw[1] }),
          K.cell(K.text(s.risk, { size: 9, color: riskHex(s.risk) }), { w: pw[2] }),
          K.cell(K.text(STATUS_LABEL[s.status] || s.status, { size: 9, color: STATUS_HEX[s.status] }), { w: pw[3] }),
        ]));
      });
      if (prows.length > 1) doc.add(K.table(pw, prows));
    }

    /* remarks & notes ---------------------------------------------------- */
    if ((insp.general_remarks || "").trim()) {
      doc.add(K.pageBreak());
      doc.add(K.text("General Remarks", { size: 13, bold: true, color: NAVY }));
      insp.general_remarks.split("\n").forEach(function (p) {
        if (p.trim()) doc.add(K.text(p.trim(), { size: 10 }));
      });
    }
    if ((insp.technical_notes || "").trim()) {
      doc.add(K.text("Important data", { size: 13, bold: true, color: NAVY }));
      insp.technical_notes.split("\n").forEach(function (p) {
        if (p.trim()) doc.add(K.text(p.trim(), { size: 10 }));
      });
    }

    /* sign-off ------------------------------------------------------------ */
    doc.add(K.text("", { size: 6 }));
    doc.add(K.text("Inspected By:", { size: 11, bold: true, color: NAVY }));
    const sw = [5040, 5040];
    doc.add(K.table(sw, [
      K.row([K.cell(K.text((set.company_name || "Lumax Energy") + ":", { size: 9, bold: true }), { w: sw[0], bg: BAND }),
      K.cell(K.text("Client/Contractor QC:", { size: 9, bold: true }), { w: sw[1], bg: BAND })]),
      K.row([K.cell(K.text("Name: " + (insp.inspector_name || ""), { size: 9 }), { w: sw[0] }),
      K.cell(K.text("Name: " + (insp.client_qc_name || ""), { size: 9 }), { w: sw[1] })], { height: 10 }),
      K.row([K.cell(K.text("Date:", { size: 9 }), { w: sw[0] }), K.cell(K.text("Date:", { size: 9 }), { w: sw[1] })], { height: 10 }),
      K.row([K.cell(K.text("Signature:", { size: 9 }), { w: sw[0] }), K.cell(K.text("Signature:", { size: 9 }), { w: sw[1] })], { height: 25 }),
    ]));

    doc.add(K.text("", { size: 6 }));
    const aw = [3000, 7080];
    doc.add(K.table(aw, [
      K.row([K.cell(K.text("Created by:", { size: 9, bold: true }), { w: aw[0], bg: BAND }),
      K.cell(K.text(insp.inspector_name || set.inspector_name || "", { size: 9 }), { w: aw[1] })], { height: 16 }),
      K.row([K.cell(K.text("Approved by:", { size: 9, bold: true }), { w: aw[0], bg: BAND }),
      K.cell(K.text(insp.approved_by || "", { size: 9 }), { w: aw[1] })], { height: 16 }),
      K.row([K.cell(K.text("Published by:", { size: 9, bold: true }), { w: aw[0], bg: BAND }),
      K.cell(K.text(insp.issued_by || "", { size: 9 }), { w: aw[1] })], { height: 16 }),
    ]));

    return doc.toBlob();
  }

  async function photosFor(snag) {
    const out = [];
    for (const id of (snag.photos || [])) {
      const p = await Store.photoBytes(id);
      if (p) out.push(p);
    }
    return out;
  }

  function b64Bytes(b64) {
    const bin = atob(b64);
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return arr;
  }

  /* ------------------------------------------------------------- csv --- */
  const CSV_COLUMNS = ["Snag ID", "Project", "Area", "Inspection", "Block/Table", "Support No",
    "Location", "Category", "Risk", "Description", "Required Action", "Contractor Response",
    "Due Date", "Priority", "Status", "Inspector", "Created", "Updated", "GPS Lat", "GPS Lng",
    "Photos", "References", "Last status note", "Former Snag ID"];

  /** The register's rows as raw values, one array per snag in CSV_COLUMNS
   *  order. The CSV and the .xlsx both write these, so they always match. */
  function registerRows(insp, mode) {
    const project = projectOf(insp);
    return filterSnags(snagsOf(insp.id), mode).map(function (s) {
      const last = (s.history || []).slice(-1)[0];
      return [s.code, project.name, insp.area, insp.number, s.block_table, s.support_no,
        s.location_text, s.category, s.risk, s.description, s.required_action, s.contractor_response,
        s.due_date, s.priority, STATUS_LABEL[s.status] || s.status, insp.inspector_name,
        localStamp(s.created_at, true), localStamp(s.updated_at, true),
        s.lat == null ? "" : s.lat, s.lng == null ? "" : s.lng,
        (s.photos || []).length, refsLine(s), last ? last.comment : "",
        (s.previous_codes || []).join("; ")];
    });
  }

  function buildCsv(insp, mode) {
    const q = function (v) {
      let s = v == null ? "" : String(v);
      // The register goes to clients and contractors, and Excel runs a cell
      // starting with = + - @ as a formula, quoted or not. A leading ' keeps
      // it as text. Numbers (a negative GPS reading) are left alone.
      if (typeof v === "string" && /^[=+\-@\t\r]/.test(s)) s = "'" + s;
      // A bare \r ends the row in Excel too, so it is quoted like \n.
      return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    const lines = [CSV_COLUMNS.join(",")];
    registerRows(insp, mode).forEach(function (row) { lines.push(row.map(q).join(",")); });
    return new Blob(["\ufeff" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
  }

  /* ------------------------------------------------------------ xlsx ---
     Excel reads a CSV cell by cell and "helps": 4-5 becomes a date, 007
     becomes 7, long numbers go to 1E+15. In an .xlsx a cell says what it is,
     so every text value goes in as an inline string and Excel keeps it
     exactly. Only real numbers (GPS, photo count) are written as numbers.
     Built with the same store-only zip as the Word file. */
  const XLSX_MIME = "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
  const XLSX_WIDTHS = [16, 22, 16, 16, 12, 11, 22, 16, 6, 48, 40, 36,
    11, 9, 12, 18, 17, 17, 11, 11, 7, 30, 36, 18];
  // Long text columns wrap, so a description is readable without widening it.
  const XLSX_WRAP = [6, 9, 10, 11, 21, 22];

  function xlsxColumn(i) {
    let s = "";
    for (i += 1; i > 0; i = Math.floor((i - 1) / 26)) s = String.fromCharCode(65 + (i - 1) % 26) + s;
    return s;
  }

  function xlsxText(v) {
    return String(v)
      // Control characters are not allowed in XML at all; Excel uses \n alone.
      .replace(/\r\n?/g, "\n")
      .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F\ufffe\uffff]/g, "")
      // Excel reads "_x0041_" in a string as an escaped "A": escape the
      // underscore so such text comes back as typed.
      .replace(/_(x[0-9A-Fa-f]{4}_)/g, "_x005F_$1")
      // An Excel cell holds at most 32,767 characters; more and it will not open.
      .slice(0, 32767)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function xlsxCell(ref, v, style) {
    if (typeof v === "number" && isFinite(v)) return '<c r="' + ref + '" s="' + style + '"><v>' + v + "</v></c>";
    if (v == null || v === "") return "";
    // Inline strings are never formulas, so "=SUM(A1)" needs no apostrophe here.
    return '<c r="' + ref + '" s="' + style + '" t="inlineStr"><is><t xml:space="preserve">' + xlsxText(v) + "</t></is></c>";
  }

  function buildXlsx(insp, mode) {
    const rows = registerRows(insp, mode);
    const last = xlsxColumn(CSV_COLUMNS.length - 1) + (rows.length + 1);
    const NS = 'xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"';
    const REL = "http://schemas.openxmlformats.org/officeDocument/2006/relationships";
    const head = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';

    const sheetRows = ['<row r="1">' + CSV_COLUMNS.map(function (h, c) {
      return xlsxCell(xlsxColumn(c) + "1", h, 1);
    }).join("") + "</row>"];
    rows.forEach(function (row, r) {
      sheetRows.push('<row r="' + (r + 2) + '">' + row.map(function (v, c) {
        return xlsxCell(xlsxColumn(c) + (r + 2), v, XLSX_WRAP.indexOf(c) >= 0 ? 3 : 2);
      }).join("") + "</row>");
    });

    const sheet = head + "<worksheet " + NS + ">" +
      '<sheetViews><sheetView workbookViewId="0">' +
      '<pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/>' +
      '<selection pane="bottomLeft" activeCell="A2" sqref="A2"/></sheetView></sheetViews>' +
      '<sheetFormatPr defaultRowHeight="15"/><cols>' +
      XLSX_WIDTHS.map(function (w, c) {
        return '<col min="' + (c + 1) + '" max="' + (c + 1) + '" width="' + w + '" customWidth="1"/>';
      }).join("") + "</cols>" +
      "<sheetData>" + sheetRows.join("") + "</sheetData>" +
      '<autoFilter ref="A1:' + last + '"/></worksheet>';

    const styles = head + "<styleSheet " + NS + ">" +
      '<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font>' +
      '<font><b/><sz val="11"/><name val="Calibri"/></font></fonts>' +
      '<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill>' +
      '<fill><patternFill patternType="solid"><fgColor rgb="FFE8EDF2"/><bgColor indexed="64"/></patternFill></fill></fills>' +
      '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>' +
      '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
      '<cellXfs count="4"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>' +
      '<xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/>' +
      '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment vertical="top"/></xf>' +
      '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf>' +
      '</cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>';

    const blob = K.zip([
      { name: "[Content_Types].xml", data: head +
        '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
        '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
        '<Default Extension="xml" ContentType="application/xml"/>' +
        '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
        '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>' +
        '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
        "</Types>" },
      { name: "_rels/.rels", data: head +
        '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
        '<Relationship Id="rId1" Type="' + REL + '/officeDocument" Target="xl/workbook.xml"/></Relationships>' },
      { name: "xl/workbook.xml", data: head +
        "<workbook " + NS + ' xmlns:r="' + REL + '"><bookViews><workbookView/></bookViews>' +
        '<sheets><sheet name="Register" sheetId="1" r:id="rId1"/></sheets>' +
        // Excel looks for the filter range under this hidden name.
        '<definedNames><definedName name="_xlnm._FilterDatabase" localSheetId="0" hidden="1">' +
        "Register!$A$1:$" + xlsxColumn(CSV_COLUMNS.length - 1) + "$" + (rows.length + 1) + "</definedName></definedNames>" +
        "</workbook>" },
      { name: "xl/_rels/workbook.xml.rels", data: head +
        '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
        '<Relationship Id="rId1" Type="' + REL + '/worksheet" Target="worksheets/sheet1.xml"/>' +
        '<Relationship Id="rId2" Type="' + REL + '/styles" Target="styles.xml"/></Relationships>' },
      { name: "xl/worksheets/sheet1.xml", data: sheet },
      { name: "xl/styles.xml", data: styles },
    ]);
    return new Blob([blob], { type: XLSX_MIME });
  }

  /* -------------------------------------------------------- pre-flight --- */
  function preflight(insp) {
    const project = projectOf(insp);
    const snags = snagsOf(insp.id);
    const out = [];
    const add = function (level, text, fix) { out.push({ level: level, text: text, fix: fix || "" }); };

    add(project.name ? "pass" : "fail", project.name ? "Project: " + project.name : "No project on this inspection", "Set it in Info.");
    add(insp.inspection_date ? "pass" : "fail",
      insp.inspection_date ? "Inspection date " + insp.inspection_date : "No inspection date", "Set it in Info.");
    add(insp.inspector_name ? "pass" : "fail",
      insp.inspector_name ? "Inspector: " + insp.inspector_name : "No inspector name", "The sign-off block needs it.");
    add(insp.client_qc_name ? "pass" : "warn",
      insp.client_qc_name ? "Client/Contractor QC: " + insp.client_qc_name : "No client/contractor QC name",
      "The counter-signature block will be blank.");
    add(snags.length ? "pass" : "fail", snags.length + " snags recorded", "Add at least one.");

    const noDesc = snags.filter(function (s) { return !(s.description || "").trim(); });
    add(noDesc.length ? "fail" : "pass",
      noDesc.length ? noDesc.length + " snags have no description" : "Every snag has a description",
      noDesc.length ? "Snags " + noDesc.map(function (s) { return s.snag_number; }).join(", ") : "");

    // A snag whose photos are all missing here prints "No photograph" too.
    const noPhoto = snags.filter(function (s) { return !keptPhotos(s).length; });
    add(noPhoto.length ? "warn" : "pass",
      noPhoto.length ? noPhoto.length + " snags have no photograph" : "Every snag has a photograph",
      noPhoto.length ? "Snags " + noPhoto.map(function (s) { return s.snag_number; }).join(", ") : "");

    // Photo ids come back with a data-only restore, the photos do not.
    // This reads the cache refreshPhotos() fills.
    const allIds = photoIdsOf(insp);
    const gone = [];
    snags.forEach(function (s) {
      (s.photos || []).forEach(function (id) { if (photoMissing(id) && gone.indexOf(id) < 0) gone.push(id); });
    });
    if (allIds.some(function (id) { return !onDevice.has(id); })) {
      add("wait", "Checking the photos are on this device…", "");
    } else if (gone.length) {
      add("warn", (gone.length === 1 ? "1 photo is" : gone.length + " photos are") + " not on this device",
        "Restore the full backup (…_full.zip) before exporting, or the report prints “No photograph” in their place.");
    }

    const noAction = snags.filter(function (s) { return !(s.required_action || "").trim(); });
    add(noAction.length ? "warn" : "pass",
      noAction.length ? noAction.length + " snags have no required action" : "Every snag has a required action", "");

    // Photo kinds live in the photos store, so this reads the cache refreshEvidence() fills.
    const verified = snags.filter(function (s) { return DONE.indexOf(s.status) >= 0; });
    const verifiedNoEvidence = [];
    let unchecked = false;
    verified.forEach(function (s) {
      if (!evidence.has(s.id)) unchecked = true;
      else if (!evidence.get(s.id)) verifiedNoEvidence.push(s.snag_number);
    });
    if (unchecked) {
      add("wait", "Checking close-out photos…", "");
    } else if (verifiedNoEvidence.length) {
      add("warn", verifiedNoEvidence.length + " verified snags have no close-out photo",
        "Snags " + verifiedNoEvidence.join(", ") + " — the close-out pack will show text only.");
    } else if (verified.length) {
      add("pass", "Verified snags carry close-out evidence", "");
    }

    const pinned = snags.filter(function (s) { return s.pin_x != null; });
    // A plan or cover whose photo is not stored here is missing from the report too.
    const planHere = insp.site_plan_id && !photoMissing(insp.site_plan_id);
    add(planHere ? "pass" : "warn",
      planHere ? "Site plan loaded, " + pinned.length + " of " + snags.length + " snags pinned"
        : insp.site_plan_id ? "Site plan image is not on this device" : "No site plan image",
      "The Site Top View page will use a plain grid." +
      (insp.site_plan_id ? " Restore the full backup (…_full.zip) to bring it back." : ""));
    const coverHere = insp.site_photo_id && !photoMissing(insp.site_photo_id);
    add(coverHere ? "pass" : "warn",
      coverHere ? "Cover photo set" : insp.site_photo_id ? "Site cover photo is not on this device" : "No site cover photo",
      "Page 1 will have no site shot." +
      (insp.site_photo_id ? " Restore the full backup (…_full.zip) to bring it back." : ""));

    const t = tally(snags);
    if (t.outstanding) add("warn", t.outstanding + " items still open (" + t.hrOpen + " high risk)",
      "Fine for a full or open-items pack; a close-out pack should be clean.");
    else if (snags.length) add("pass", "All items verified or closed", "");

    const ready = !out.some(function (c) { return c.level === "fail"; });
    return { checks: out, ready: ready };
  }

  /* Snag id -> has an After/Close-out photo. Kept out of state on purpose:
   * it is derived from the photo records and must never be saved. */
  const evidence = new Map();

  /* Photo id -> stored on this device. A data-only restore keeps the photo
   * ids on each snag but brings no photos, so this is checked, never
   * assumed. Also kept out of state: it describes this phone, not the job. */
  const onDevice = new Map();

  function photoIdsOf(insp) {
    const ids = [];
    const push = function (id) { if (id && ids.indexOf(id) < 0) ids.push(id); };
    push(insp.site_plan_id);
    push(insp.site_photo_id);
    snagsOf(insp.id).forEach(function (s) { (s.photos || []).forEach(push); });
    return ids;
  }

  /** True only once a check has found the photo is not stored here. */
  function photoMissing(id) { return onDevice.get(id) === false; }

  /** The snag's photos less any known to be missing on this device. */
  function keptPhotos(s) {
    return (s.photos || []).filter(function (id) { return !photoMissing(id); });
  }

  /** Check which of the inspection's photos are stored here. Resolves true
   *  only when a photo is found missing or comes back, so the snag list
   *  re-renders once and then stops (an unchecked photo counts as present). */
  async function refreshPhotos(insp) {
    const ids = photoIdsOf(insp);
    if (!ids.length) return false;
    const stored = new Set(await Store.photoIds());
    let changed = false;
    ids.forEach(function (id) {
      const has = stored.has(id);
      const was = onDevice.get(id);
      if (was === has) return;
      onDevice.set(id, has);
      if (!has || was === false) changed = true;
    });
    return changed;
  }

  /** Re-read photo kinds for the verified snags, and which photos are on
   *  this device. Resolves true only when an answer changed, so the caller
   *  re-renders once and then stops. */
  async function refreshEvidence(insp) {
    // Pre-flight shows "Checking…" until every photo has been looked up once.
    const unchecked = photoIdsOf(insp).some(function (id) { return !onDevice.has(id); });
    let changed = (await refreshPhotos(insp)) || unchecked;
    for (const s of snagsOf(insp.id)) {
      if (DONE.indexOf(s.status) < 0) continue;
      let has = false;
      for (const id of (s.photos || [])) {
        const p = await Store.getPhoto(id);
        if (p && (p.kind === "closeout" || p.kind === "after")) { has = true; break; }
      }
      if (evidence.get(s.id) !== has) { evidence.set(s.id, has); changed = true; }
    }
    return changed;
  }

  function fileBase(insp, mode, rev) {
    const project = projectOf(insp);
    const safe = function (s) {
      return String(s || "").replace(/[^\w\s-]/g, "").trim().replace(/\s+/g, "_").slice(0, 40);
    };
    const tag = mode === "open" ? "OpenItems" : mode === "closeout" ? "CloseOut" : "Full";
    return (safe(insp.number) || "Inspection") + "_" + (safe(project.name) || "PunchList") + "_" + tag +
      "_Rev" + rev + "_" + (safe(insp.inspection_date) || today());
  }

  return {
    buildDocx: buildDocx, buildCsv: buildCsv, buildXlsx: buildXlsx, preflight: preflight, refreshEvidence: refreshEvidence,
    refreshPhotos: refreshPhotos, photoMissing: photoMissing, keptPhotos: keptPhotos,
    renderMap: renderMap, fileBase: fileBase, filterSnags: filterSnags,
  };
})();

function saveBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; a.rel = "noopener";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
}

// A shared file needs a plain MIME type: Chrome refuses "text/csv;charset=…",
// and the share sheet picks apps (Word, Excel, Drive) by it.
const SHARE_MIME = {
  docx: "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
  csv: "text/csv", zip: "application/zip", json: "application/json",
  xlsx: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
};
function fileFor(blob, filename) {
  const ext = filename.split(".").pop().toLowerCase();
  return new File([blob], filename, { type: SHARE_MIME[ext] || blob.type || "application/octet-stream" });
}

/** True when this browser can hand a file like `filename` to the phone's share
 *  sheet. Browsers allow different file types, so it is asked per type. */
function canShareFile(filename) {
  try {
    return !!(navigator.canShare && navigator.share &&
      navigator.canShare({ files: [fileFor(new Blob([]), filename)] }));
  } catch (err) {
    return false;
  }
}

/** Send a file through the share sheet (mail, WhatsApp, Drive…). Resolves
 *  "shared", "cancelled" or "downloaded": any failure other than the user
 *  backing out falls back to a normal download, so the file is never lost.
 *  With `afterWait`, a refusal because the tap was too long ago resolves
 *  "expired" instead, so the caller can ask for a fresh tap. */
async function shareBlob(blob, filename, afterWait) {
  try {
    await navigator.share({ files: [fileFor(blob, filename)], title: filename });
    return "shared";
  } catch (err) {
    if (err && err.name === "AbortError") return "cancelled";
    if (afterWait && err && err.name === "NotAllowedError") return "expired";
    console.warn("Share failed, downloading instead", err);
    saveBlob(blob, filename);
    return "downloaded";
  }
}

/** Share a file that took a while to build. Browsers only open the share
 *  sheet within a few seconds of a tap, so if that has passed, show the file
 *  as ready with a Share now button: a fresh tap. Resolves like shareBlob;
 *  closing that sheet counts as "cancelled". */
function shareBuilt(blob, filename) {
  return shareBlob(blob, filename, true).then(function (how) {
    if (how !== "expired") return how;
    return new Promise(function (res) {
      UI.hideToast();
      App.modal = { type: "share" };   // so Escape closes it
      App.shareReady = { blob: blob, filename: filename, done: res };
      UI.openModal(UI.sheetHead("Ready to share") + '<div class="sheet-b">' +
        '<p style="margin:0 0 12px"><b>' + esc(filename) + "</b> (" + esc(fmtBytes(blob.size)) + ") is ready.</p>" +
        '<button class="btn btn-p" data-a="share-ready">Share now</button></div>');
    });
  });
}
/* ============================================================================
   Views. Every screen is a string of HTML; buttons carry data-a="action" and
   are handled by one delegated listener in app.js. Small, predictable, and it
   survives being read on a phone in the sun.
   ========================================================================== */
const App = {
  route: "home", inspId: null, tab: "snags", snagId: null,
  filter: "all", query: "", placing: false, pinFor: null, modal: null, busy: false,
  backupNagHidden: false,   // the home backup reminder, dismissed until the next load
  shareReady: null,         // a built file waiting for its Share now tap
};

const UI = (function () {
  "use strict";

  let toastTimer = null;
  function toast(msg, bad, ms) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.className = "toast show" + (bad ? " bad" : "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.className = "toast" + (bad ? " bad" : ""); }, ms || 2600);
  }
  // Clears a long "Building…" toast when there is nothing to say after it.
  function hideToast() {
    clearTimeout(toastTimer);
    document.getElementById("toast").className = "toast";
  }

  /** A download button, with a "Share…" button beside it when this browser can
   *  share that kind of file. `attrs` are the download button's data-a/data-v;
   *  the share button repeats them with data-share, so one action does both. */
  function withShare(btn, attrs, filename, what) {
    if (!canShareFile(filename)) return btn;
    return '<div class="btn-row">' + btn +
      '<button class="btn btn-share" ' + attrs + ' data-share="1" aria-label="Share ' + esc(what) + '">Share…</button></div>';
  }

  const tag = function (cls, txt) { return '<span class="tag ' + esc(cls) + '">' + esc(txt) + "</span>"; };
  const riskTag = function (r) { return tag("t-" + r, r); };
  const statusTag = function (s) { return tag("t-" + s, STATUS_LABEL[s] || s); };

  /** A 0–1 fraction as a CSS percentage. A restored file can hold anything,
   *  so only a finite number ever reaches a style attribute. */
  function pct(f) {
    const n = Number(f);
    return isFinite(n) ? (Math.min(1, Math.max(0, n)) * 100).toFixed(2) : "0";
  }

  function bar(t) {
    if (!t.total) return "";
    const pc = function (n) { return pct(n / t.total) + "%"; };
    return '<div class="bar" title="' + esc(t.open + " open, " + t.prog + " in progress, " + t.done + " done") + '">' +
      '<i class="open" style="width:' + pc(t.open) + '"></i>' +
      '<i class="prog" style="width:' + pc(t.prog) + '"></i>' +
      '<i class="done" style="width:' + pc(t.done) + '"></i></div>';
  }

  function field(label, inner) {
    return '<label class="field"><span class="lbl">' + esc(label) + "</span>" + inner + "</label>";
  }
  function input(name, value, opts) {
    opts = opts || {};
    return '<input class="inp" data-f="' + esc(name) + '" type="' + esc(opts.type || "text") + '" value="' +
      esc(value == null ? "" : value) + '"' + (opts.placeholder ? ' placeholder="' + esc(opts.placeholder) + '"' : "") +
      (opts.inputmode ? ' inputmode="' + esc(opts.inputmode) + '"' : "") + " />";
  }
  function dateField(name, value) {

      esc(value || "") + '">' + esc(shown) + "</button>";
  }
  function textarea(name, value, ph, rows) {
    return '<textarea class="inp" data-f="' + esc(name) + '"' + (rows ? ' style="min-height:' + (Number(rows) || 0) * 22 + 'px"' : "") +
      (ph ? ' placeholder="' + esc(ph) + '"' : "") + ">" + esc(value || "") + "</textarea>";
  }
  function select(name, value, options) {
    return '<select class="inp" data-f="' + esc(name) + '">' + options.map(function (o) {
      const v = Array.isArray(o) ? o[0] : o, l = Array.isArray(o) ? o[1] : o;
      return '<option value="' + esc(v) + '"' + (String(value) === String(v) ? " selected" : "") + ">" + esc(l) + "</option>";

    }).join("") + "</div>";
  }

  /* ------------------------------------------------------------- chrome --- */
  function chrome() {

      tabs.className = "tabs";
      tabs.innerHTML = items.map(function (i) {
        return '<button data-a="tab" data-v="' + esc(i[0]) + '" class="' + (App.tab === i[0] ? "on" : "") + '">' +
          (i[2] !== "" ? '<span class="n">' + esc(i[2]) + "</span>" : "") + esc(i[1]) + "</button>";
      }).join("");

  function currentInspection() {

  }

  /* ---------------------------------------------------- backup reminder --- */
  /** What the home screen should say about backups, or null for nothing.
   *  Everything lives on one phone, so remind until a recent copy exists. */
  function backupDue() {
    const st = Store.get();
    if (!st.projects.length && !st.inspections.length && !st.snags.length) return null;
    const last = Date.parse(st.settings.last_backup_at || "");
    if (isNaN(last)) return { never: true };
    // A data-only backup leaves the photos on this phone alone, so they have
    // their own clock: the last full backup.
    const full = Date.parse(st.settings.last_full_backup_at || "");
    const hasPhotos = st.snags.some(function (s) { return (s.photos || []).length; }) ||
      st.inspections.some(function (i) { return (i.photos || []).length || i.site_photo_id || i.site_plan_id; });
    if (hasPhotos && isNaN(full)) return { photosNever: true };
    const day = 24 * 60 * 60 * 1000;
    // A day's grace after each backup, and no reminder when nothing changed.
    if (Date.now() - last < day || !(Date.parse(st.updated_at) > last)) {
      if (hasPhotos && Date.now() - full >= day && Date.parse(st.settings.photos_changed_at || "") > full) {
        return { photosAt: st.settings.last_full_backup_at };
      }
      return null;
    }
    const after = function (iso) { return Date.parse(iso || "") > last; };
    return {
      at: st.settings.last_backup_at,
      snags: st.snags.filter(function (s) { return after(s.updated_at) || after(s.created_at); }).length,
      inspections: st.inspections.filter(function (i) { return after(i.created_at); }).length,
    };
  }

  function backupNag() {
    const due = App.backupNagHidden ? null : backupDue();
    if (!due) return "";
    let text = "This phone holds the only copy — back up now";
    if (due.photosNever) {
      text = "Photos have never been backed up — this phone holds the only copy";
    } else if (due.photosAt) {
      text = "Photos not backed up since " + localStamp(due.photosAt) + " — new or changed photos are only on this phone";
    } else if (!due.never) {
      const bits = [];
      if (due.snags) bits.push(due.snags + " snag" + (due.snags > 1 ? "s" : "") + " changed");
      if (due.inspections) bits.push(due.inspections + " new inspection" + (due.inspections > 1 ? "s" : ""));
      // Deletes and project edits leave nothing to count, but still changed the data.
      text = "Not backed up since " + localStamp(due.at) + " — " + (bits.length ? bits.join(", ") : "changes since then");
    }
    return '<div class="banner warn" style="align-items:center"><span>!</span>' +
      '<span style="flex:1;min-width:0">' + esc(text) + "</span>" +
      '<button class="btn btn-p btn-xs" data-a="backup" data-v="full">Back up now</button>' +
      '<button class="btn btn-xs" data-a="hide-backup-nag" aria-label="Hide this reminder">✕</button></div>';
  }

  /** How to get the app onto a phone. A downloaded file (file://) and the
   *  hosted page (https, with the service worker) need different advice. */
  function phoneHelp() {
    if (location.protocol === "file:") {
      return "Android: open this file in Chrome. iPhone: Chrome cannot open a downloaded HTML file — in Files, tap the file and open it in Safari. GPS on a downloaded file is blocked in Chrome; use Safari or Enter coordinates. Pin on the plan always works.";
    }
    if (!("serviceWorker" in navigator) || !window.isSecureContext) {
      return "This browser cannot keep a copy of the app, so it needs signal to open. Your inspections are still stored on this device. Pin on the plan always works.";
    }
    return "Works with no signal after the first visit. Add it to your home screen: Android Chrome menu ⋮ → Add to Home screen; iPhone Safari Share → Add to Home Screen. Pin on the plan always works.";
  }

  /* -------------------------------------------------------------- snags --- */
  function snagRow(s, showCode) {
    const done = DONE.indexOf(s.status) >= 0;
    const loc = [s.block_table, s.support_no ? "Supp " + s.support_no : "", s.location_text]
      .filter(Boolean).join(" · ");
    const thumb = (s.photos || []).length
      ? '<img class="thumb" data-pid="' + esc(s.photos[0]) + '" alt="" />' : "";
    return '<button class="rail r-' + esc(s.risk) + (done ? " done" : "") + '" data-a="open-snag" data-id="' + esc(s.id) + '">' +
      thumb +
      '<span class="rh"><span class="num">' + esc(s.snag_number) + "</span>" +
      riskTag(s.risk) + statusTag(s.status) +
      (s.pin_x != null ? '<span class="tag" style="color:var(--ink-3)">pin</span>' : "") + "</span>" +
      '<span class="desc">' + esc(s.description || "(no description yet)") + "</span>" +
      '<span class="meta">' + esc(showCode ? s.code : loc || s.code) +
      ((s.photos || []).length ? " · " + esc(s.photos.length) + "📷" : "") +
      // Red once it is past due, so late items stand out while scrolling.
      (s.due_date ? " · <span" + (isOverdue(s) ? ' class="late"' : "") + ">Due " + esc(s.due_date) + "</span>" : "") +
      "</span></button>";
  }

  function viewSnags(insp) {
    const all = snagsOf(insp.id);
    const t = tally(all);
    const f = App.filter;
    const shown = all.filter(function (s) {
      if (f === "open") return DONE.indexOf(s.status) < 0;
      if (f === "hr") return s.risk === "HR" && DONE.indexOf(s.status) < 0;
      if (f === "done") return DONE.indexOf(s.status) >= 0;
      if (f === "overdue") return isOverdue(s);
      if (f === "nophoto") return !Report.keptPhotos(s).length;
      return true;
    });
    // Photos listed on a snag may not be stored here (a data-only restore),
    // so check after paint and redraw only if one went missing or came back.
    Report.refreshPhotos(insp).then(function (changed) {
      if (changed && App.route === "inspection" && App.tab === "snags" && App.inspId === insp.id) render();
    }).catch(function (err) { console.error(err); });
    const chips = [["all", "All " + t.total], ["open", "Open " + t.outstanding], ["hr", "HR open " + t.hrOpen],
    ["overdue", "Overdue " + t.overdue], ["done", "Done " + t.done], ["nophoto", "No photo"]];

    const list = shown.length ? shown.map(function (s) { return snagRow(s); }).join("")
      : '<div class="empty"><b>Nothing here</b>' +
      (all.length ? "No snags match this filter." : "Tap “Add snag” to capture the first one.") + "</div>";

    const last = all[all.length - 1];
    return '<div class="stack">' +
      '<div class="scroller">' + chips.map(function (c) {
        return '<button class="chip' + (f === c[0] ? " on" : "") + '" data-a="filter" data-v="' + esc(c[0]) + '">' + esc(c[1]) + "</button>";
      }).join("") + "</div>" +
      (all.length ? '<div class="card"><div class="card-b" style="padding:10px">' + bar(t) + "</div></div>" : "") +
      '<div class="btn-row">' +
      '<button class="btn btn-p" data-a="new-snag">＋ Add snag</button>' +
      (last ? '<button class="btn" data-a="repeat-last">Repeat snag ' + esc(last.snag_number) + "</button>" : "") +
      "</div>" +
      "<div>" + list + "</div></div>";
  }

      .sort(function (a, b) { return b.rev - a.rev; });
    const t = tally(snagsOf(insp.id));
    // Photo kinds sit in IndexedDB, so check them after paint and redraw only
    // if an answer changed; the redraw finds nothing new and stops there.
    Report.refreshEvidence(insp).then(function (changed) {
      if (changed && App.route === "inspection" && App.tab === "report" && App.inspId === insp.id) render();
    }).catch(function (err) { console.error(err); });

    return '<div class="stack">' +
      '<div class="banner ' + (pf.ready ? "good" : "bad") + '"><span>' + (pf.ready ? "✓" : "✕") + "</span>" +
